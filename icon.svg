<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Глубокий тёмный фон в стиле iOS Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f182e"/>
      <stop offset="55%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Мягкое неоново-синее свечение позади стеклянной плитки -->
    <radialGradient id="ambientGlow" cx="30%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#2563eb" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Поверхность матовой стеклянной плитки -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d4d" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#131d33" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#0c1324" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Контурный стеклянный блик на грани плитки -->
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="38%" stop-color="#60a5fa" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Диагональный блик сверху на стекле -->
    <linearGradient id="topSheen" x1="15%" y1="0%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#93c5fd" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Градиент букв ШРК -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>

    <!-- Акцентная светящаяся линия -->
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Глубокая тень под стеклянной плиткой -->
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02040a" flood-opacity="0.75"/>
    </filter>

    <!-- Лёгкая тень под буквами для объёма -->
    <filter id="letterShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#040814" flood-opacity="0.55"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="52" y="52" width="408" height="408" rx="92"/>
    </clipPath>
  </defs>

  <!-- Внешняя форма иконки -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#ambientGlow)"/>
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Стеклянная матовая плитка -->
  <g filter="url(#tileShadow)">
    <rect x="52" y="52" width="408" height="408" rx="92" fill="url(#glassFill)"/>
  </g>

  <!-- Мягкий диагональный блик внутри плитки -->
  <g clip-path="url(#tileClip)">
    <path d="M40 40 H472 L300 265 L40 215 Z" fill="url(#topSheen)"/>
  </g>

  <!-- Стеклянная грань плитки -->
  <rect x="53.5" y="53.5" width="405" height="405" rx="90.5" fill="none" stroke="url(#glassStroke)" stroke-width="3"/>

  <!-- Геометричная монограмма «ШРК» -->
  <g fill="url(#textGrad)" fill-rule="evenodd" filter="url(#letterShadow)">
    <!-- Ш -->
    <path d="M88 180 H112 V304 H132 V180 H156 V304 H176 V180 H200 V328 H88 Z"/>
    <!-- Р -->
    <path d="M222 180 H264 A46 46 0 0 1 264 272 H246 V328 H222 Z M246 204 H262 A22 22 0 0 1 262 248 H246 Z"/>
    <!-- К -->
    <path d="M330 180 H354 V243 H364 L396 180 H424 L386 253 L425 328 H396 L364 265 H354 V328 H330 Z"/>
  </g>

  <!-- Тонкий неоновый акцент внизу плитки -->
  <rect x="176" y="362" width="160" height="8" rx="4" fill="url(#accentBar)" opacity="0.9"/>
</svg>
