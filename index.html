<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="metaThemeColor" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ШРК Уроки">
  <title>Расписание — ШРК</title>
  <link rel="manifest" id="manifestLink" href="./manifest.json?v=3">
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=3">
  <link rel="shortcut icon" href="./icon.svg?v=3">
  <link rel="apple-touch-icon" sizes="180x180" id="appleTouchIcon" href="./icon.svg?v=3">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f19;
      --surface: #131926;
      --surface-2: #1a2234;
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.26);
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --now: #10b981;
      --now-soft: rgba(16, 185, 129, 0.13);
      --now-tx: #34d399;
      --corp-a-bg: rgba(59, 130, 246, 0.14);
      --corp-a-tx: #93c5fd;
      --corp-b-bg: rgba(168, 85, 247, 0.14);
      --corp-b-tx: #d8b4fe;
      --corp-v-bg: rgba(20, 184, 166, 0.14);
      --corp-v-tx: #5eead4;
      --dist-bg: rgba(245, 158, 11, 0.16);
      --dist-tx: #fbbf24;
      --tg-bg: rgba(56, 189, 248, 0.13);
      --tg-border: rgba(56, 189, 248, 0.34);
      --tg-tx: #38bdf8;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.16);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --now: #059669;
      --now-soft: rgba(5, 150, 105, 0.09);
      --now-tx: #059669;
      --corp-a-bg: rgba(37, 99, 235, 0.09);
      --corp-a-tx: #1d4ed8;
      --corp-b-bg: rgba(147, 51, 234, 0.09);
      --corp-b-tx: #7e22ce;
      --corp-v-bg: rgba(13, 148, 136, 0.09);
      --corp-v-tx: #0f766e;
      --dist-bg: rgba(245, 158, 11, 0.14);
      --dist-tx: #b45309;
      --tg-bg: rgba(2, 132, 199, 0.1);
      --tg-border: rgba(2, 132, 199, 0.28);
      --tg-tx: #0284c7;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px calc(36px + env(safe-area-inset-bottom, 0px));
      line-height: 1.38;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; margin: 0 auto; }

    /* Шапка */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 4px 2px 12px;
    }
    .title-block { min-width: 0; }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
    }
    .creator-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--tg-bg);
      border: 1px solid var(--tg-border);
      color: var(--tg-tx);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.12s, border-color 0.15s, filter 0.15s;
    }
    .creator-chip:hover { filter: brightness(1.08); border-color: var(--tg-tx); }
    .creator-chip:active { transform: scale(0.96); }
    .creator-chip svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }
    .creator-chip b { font-weight: 800; }

    .top-actions { display: flex; gap: 6px; flex-shrink: 0; padding-top: 2px; }
    .top-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      height: 34px;
      min-width: 34px;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.1s;
    }
    .top-btn:active { transform: scale(0.96); }
    .top-btn.accent {
      background: var(--accent-soft);
      border-color: rgba(59, 130, 246, 0.35);
      color: var(--accent);
    }

    /* Подсказка установки PWA */
    .install-sheet {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }
    .install-sheet.open { display: flex; }
    .install-sheet-body { flex: 1; line-height: 1.45; }
    .install-copy-btn {
      margin-top: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .install-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }

    /* Переключатель учебных дней (Сегодня / Завтра — всегда под рукой) */
    .day-pills {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .day-pill {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 11px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.15s;
    }
    .day-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .new-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--now);
      flex-shrink: 0;
    }
    .wait-tag {
      font-size: 10.5px;
      font-weight: 600;
      opacity: 0.72;
    }

    /* Сегментированные вкладки режимов */
    .seg-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 10px;
    }
    .seg-tab {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 7px 6px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .seg-tab.active {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }

    /* Панель управления классом + кнопка Поделиться */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .picker-trigger {
      background: var(--accent);
      color: #fff;
      border: none;
      height: 36px;
      padding: 0 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .picker-trigger:active { transform: scale(0.97); }
    .picker-chevron {
      font-size: 11px;
      opacity: 0.85;
      transition: transform 0.18s;
    }
    .picker-trigger.open .picker-chevron { transform: rotate(180deg); }

    .summary-text {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .share-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: border-color 0.15s, transform 0.1s;
    }
    .share-btn:hover { border-color: var(--accent); }
    .share-btn:active { transform: scale(0.97); }
    .share-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

    /* Выпадающая панель выбора параллели и класса */
    .drawer {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
      display: none;
    }
    .drawer.open { display: block; }
    .grade-bar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .grade-chip {
      background: var(--surface-2);
      border: 1px solid transparent;
      color: var(--muted);
      height: 34px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .grade-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 6px;
    }
    .class-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      height: 36px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .class-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Поиск учителя и кабинетов */
    .filter-box { margin-bottom: 10px; }
    .search-wrap { position: relative; margin-bottom: 8px; }
    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 36px 0 13px;
      border-radius: 11px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 14.5px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      display: none;
    }
    .horiz-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .horiz-scroll::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Панель раздела Кабинеты */
    .rooms-mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }
    .rooms-mode-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .rooms-mode-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .free-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .free-rooms-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px;
    }
    .free-rooms-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .free-rooms-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    /* Живой статус — показывается ТОЛЬКО во время учебного дня */
    .live-bar {
      background: var(--now-soft);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--now-tx);
      border-radius: 11px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .live-left { display: flex; align-items: center; gap: 8px; }
    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--now);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
      flex-shrink: 0;
    }

    /* Список уроков */
    .lessons-stack { display: flex; flex-direction: column; gap: 6px; }

    .lesson-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, border-color 0.15s;
    }
    .lesson-card.is-past { opacity: 0.52; }
    .lesson-card.is-now {
      border-color: var(--now);
      background: linear-gradient(90deg, var(--now-soft), var(--surface) 65%);
    }
    .lesson-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2.5px;
      background: var(--now);
      transition: width 0.3s;
    }

    .num-col {
      width: 46px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-right: 10px;
      border-right: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .num-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .lesson-card.is-now .num-val { color: var(--now-tx); }
    .t-start { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 4px; line-height: 1.1; }
    .t-end { font-size: 10.5px; color: var(--muted); opacity: 0.72; line-height: 1.1; }

    .body-col { flex: 1; min-width: 0; }
    .row-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .subj {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.28;
      word-break: break-word;
    }
    .teacher-btn {
      background: none;
      border: none;
      padding: 0;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      display: inline-block;
    }
    .teacher-btn:hover { color: var(--accent); text-decoration: underline; }

    /* Интерактивный бейдж кабинета */
    .room {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      background: var(--corp-a-bg);
      color: var(--corp-a-tx);
      border: 1px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      font-family: inherit;
    }
    button.room { cursor: pointer; transition: transform 0.1s, border-color 0.15s; }
    button.room:hover { border-color: currentColor; }
    button.room:active { transform: scale(0.95); }
    .room.corp-b { background: var(--corp-b-bg); color: var(--corp-b-tx); }
    .room.corp-v { background: var(--corp-v-bg); color: var(--corp-v-tx); }
    .room.dist { background: var(--dist-bg); color: var(--dist-tx); }

    /* Подгруппы */
    .sg-split {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }
    .sg-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding-top: 7px;
      border-top: 1px dashed var(--border);
    }
    .sg-row:first-child { padding-top: 0; border-top: none; }
    .sg-num-pill {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--muted);
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 5px;
    }

    /* Тонкий делитель только для большой перемены (20м) и окон */
    .divider-note {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 8px 1px 58px;
      opacity: 0.85;
    }
    .divider-note::before, .divider-note::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Карточка ожидания завтрашнего расписания */
    .waiting-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 18px;
      text-align: center;
    }
    .waiting-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .waiting-sub {
      font-size: 13px;
      color: var(--muted);
      max-width: 420px;
      margin: 0 auto 14px;
      line-height: 1.45;
    }
    .waiting-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-pill {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .action-pill.secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 28px 16px;
      background: var(--surface);
      border-radius: 13px;
      border: 1px solid var(--border);
      font-size: 13.5px;
    }

    .toast {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-strong);
      font-weight: 600;
      font-size: 12.5px;
      padding: 8px 15px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 420px) {
      h1 { font-size: 18px; }
      .divider-note { padding-left: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="title-block">
        <h1 id="title">Расписание</h1>
        <div class="sub-meta">
          <span id="meta">Загрузка...</span>
          <a class="creator-chip" id="creatorLink" href="https://t.me/cryforsex" target="_blank" rel="noopener noreferrer">

  <script>
    const BELLS_MONDAY = {

    const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const FULL_WD = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    const SHORT_WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    const WAITING_TOMORROW_KEY = '__waiting_tomorrow__';

    const isTgWebApp = Boolean(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      if (window.Telegram.WebApp.colorScheme === 'light' && !localStorage.getItem('ui_theme')) {

    const savedTheme = localStorage.getItem('ui_theme');

    (function setupAppleTouchIcon() {
      const link = document.getElementById('appleTouchIcon');
      if (!link) return;
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 180;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 180, 180);
          link.href = canvas.toDataURL('image/png');
        } catch (_) {}
      };

    })();

    if ('serviceWorker' in navigator && !isTgWebApp) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=5').catch(() => {});

    }

    const els = {
      title: document.getElementById('title'),
      meta: document.getElementById('meta'),
      metaThemeColor: document.getElementById('metaThemeColor'),
      creatorLink: document.getElementById('creatorLink'),
      installBtn: document.getElementById('installBtn'),
      installSheet: document.getElementById('installSheet'),
      installSheetBody: document.getElementById('installSheetBody'),
      installClose: document.getElementById('installClose'),
      daySwitcher: document.getElementById('daySwitcher'),
      themeBtn: document.getElementById('themeBtn'),
      tabClass: document.getElementById('tabClass'),
      tabTeacher: document.getElementById('tabTeacher'),
      tabRooms: document.getElementById('tabRooms'),
      classControls: document.getElementById('classControls'),
      pickerTrigger: document.getElementById('pickerTrigger'),
      currentClassLabel: document.getElementById('currentClassLabel'),
      classSummary: document.getElementById('classSummary'),
      classDrawer: document.getElementById('classDrawer'),
      gradeRow: document.getElementById('gradeRow'),
      classGrid: document.getElementById('classGrid'),
      teacherPanel: document.getElementById('teacherPanel'),
      teacherInput: document.getElementById('teacherInput'),
      clearTeacherBtn: document.getElementById('clearTeacherBtn'),
      teacherChips: document.getElementById('teacherChips'),
      roomsPanel: document.getElementById('roomsPanel'),
      rmFreeBtn: document.getElementById('rmFreeBtn'),
      rmBusyBtn: document.getElementById('rmBusyBtn'),
      freeRoomsControls: document.getElementById('freeRoomsControls'),
      freeLessonChips: document.getElementById('freeLessonChips'),
      freeCorpChips: document.getElementById('freeCorpChips'),
      busyRoomControls: document.getElementById('busyRoomControls'),
      roomInput: document.getElementById('roomInput'),
      clearRoomBtn: document.getElementById('clearRoomBtn'),
      roomChips: document.getElementById('roomChips'),
      liveBar: document.getElementById('liveBar'),
      liveLeft: document.getElementById('liveLeft'),
      liveRight: document.getElementById('liveRight'),
      shareBtn: document.getElementById('shareBtn'),
      list: document.getElementById('contentList'),
      toast: document.getElementById('toast')
    };

    let RAW_JSON = null;
    let DAYS_MAP = {};
    let DAY_KEYS = [];
    let ALL_KNOWN_ROOMS = [];
    let selectedDayKey = '';
    let DATA = null;
    let ALL_TEACHERS = [];
    let ALL_ROOMS = [];
    let mode = 'class'; // 'class' | 'teacher' | 'rooms'
    let roomsSubMode = 'free'; // 'free' | 'busy'
    let freeLessonNum = null;
    let freeBuilding = 'all'; // 'all' | 'А' | 'Б' | 'В'
    let currentRoom = '';
    const hasSavedClassInitially = Boolean(localStorage.getItem('selected_class'));
    let drawerOpen = !hasSavedClassInitially;
    let currentGrade = localStorage.getItem('saved_grade') || '5';
    let currentClass = localStorage.getItem('selected_class') || '5 А';
    let currentTeacher = localStorage.getItem('selected_teacher') || '';
    let deferredInstallPrompt = null;
    let lastFetchTime = 0;

    const ua = navigator.userAgent || '';
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIos = /iphone|ipad|ipod/i.test(ua);
    const isAndroid = /android/i.test(ua);
    const isInAppWebView = /Telegram|VKClient|Instagram|FBAN|FBAV|Line\/|wv\)/i.test(ua);
    const isDesktopFirefox = /firefox/i.test(ua) && !isAndroid && !isIos;

    if (!isStandalone && !isTgWebApp) {
      els.installBtn.style.display = 'inline-flex';
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        els.installBtn.style.display = 'inline-flex';
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        els.installBtn.style.display = 'none';
        els.installSheet.classList.remove('open');
        showToast('Приложение установлено');
      });
    }

    function buildInstallHelpHtml() {
      if (isInAppWebView) {
        return `
          <b>Открой сайт в основном браузере</b><br>
          Встроенное окно мессенджера блокирует установку. Нажми <b>⋮</b> в углу → <b>«Открыть в браузере»</b> (Chrome / Safari), затем нажми <b>📲</b>.<br>
          <button type="button" class="install-copy-btn" id="copySiteUrlBtn">Скопировать ссылку</button>
        `;
      }
      if (isIos) {
        return `<b>Установка на iPhone:</b> нажми <b>«Поделиться» (⬆️)</b> внизу Safari → <b>«На экран „Домой“» → «Добавить»</b>.`;
      }
      if (isAndroid) {
        return `<b>Установка на Android:</b> открой меню браузера <b>⋮</b> и выбери <b>«Установить приложение»</b> (или «Добавить на гл. экран»).`;
      }
      if (isDesktopFirefox) {
        return `
          <b>Установка на ПК:</b> настольный Firefox не поддерживает PWA — открой ссылку в <b>Chrome, Edge или Яндекс Браузере</b>.<br>
          <button type="button" class="install-copy-btn" id="copySiteUrlBtn">Скопировать ссылку</button>
        `;
      }
      return `Нажми на значок установки справа в адресной строке или в меню браузера <b>⋮ → «Установить ШРК Уроки»</b>.`;
    }

    els.installBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice && choice.outcome === 'accepted') {
          els.installBtn.style.display = 'none';
        }
        deferredInstallPrompt = null;
        return;
      }
      els.installSheetBody.innerHTML = buildInstallHelpHtml();
      els.installSheet.classList.toggle('open');
      const copyBtn = document.getElementById('copySiteUrlBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(location.origin + location.pathname);
            showToast('Ссылка скопирована');
          } catch (_) {}
        });
      }
    });

    els.installClose.addEventListener('click', () => els.installSheet.classList.remove('open'));

    els.creatorLink.addEventListener('click', (e) => {
      if (isTgWebApp && typeof window.Telegram.WebApp.openTelegramLink === 'function') {
        e.preventDefault();
        window.Telegram.WebApp.openTelegramLink('https://t.me/cryforsex');
      }
    });

    function syncTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      els.themeBtn.textContent = isLight ? '☀️' : '🌙';
      if (els.metaThemeColor) {
        els.metaThemeColor.setAttribute('content', isLight ? '#f4f6fa' : '#0b0f19');
      }
    }
    syncTheme();

    els.themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ui_theme', next);
      syncTheme();
    });

    function parseDateKey(str) {
      const m = String(str || '').match(/(\d{1,2})[._-](\d{1,2})[._-](\d{4})/);
      if (!m) return null;
      return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    }

    function formatDateObj(dt) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(dt.getDate())}.${pad(dt.getMonth() + 1)}.${dt.getFullYear()}`;
    }

    function formatDdMm(dateStr) {
      const m = String(dateStr || '').match(/(\d{1,2})[._-](\d{1,2})[._-](\d{4})/);
      return m ? `${m[1].padStart(2, '0')}.${m[2].padStart(2, '0')}` : dateStr;
    }

    function formatHumanTitle(dateStr, weekdayRaw) {
      const dt = parseDateKey(dateStr);
      if (!dt) return dateStr || 'Расписание';
      const dayNum = dt.getDate();
      const monthName = MONTHS_GEN[dt.getMonth()];
      let wd = weekdayRaw ? weekdayRaw.trim() : FULL_WD[dt.getDay()];
      wd = wd.charAt(0).toUpperCase() + wd.slice(1).toLowerCase();
      return `${wd}, ${dayNum} ${monthName}`;
    }

    function formatShortUpdated(updStr) {
      if (!updStr) return 'из MAX';
      const parts = updStr.trim().split(/\s+/);
      if (parts.length >= 2) {
        return `обновлено в ${parts[1]}`;
      }
      return `обновлено ${updStr}`;
    }

    function getMskNow() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });
      const todayDt = new Date(Number(map.year), Number(map.month) - 1, Number(map.day));
      const nextDt = new Date(todayDt);
      nextDt.setDate(nextDt.getDate() + 1);
      // Если завтра воскресенье — следующий учебный день понедельник
      if (nextDt.getDay() === 0) {
        nextDt.setDate(nextDt.getDate() + 1);
      }
      return {
        dateStr: formatDateObj(todayDt),
        nextStudyDateStr: formatDateObj(nextDt),
        isNextTomorrow: (nextDt.getTime() - todayDt.getTime()) <= 86400000 * 1.2,
        todayTs: todayDt.getTime(),
        minutes: Number(map.hour) * 60 + Number(map.minute)
      };
    }

    function pickInitialDayKey() {
      if (!DAY_KEYS.length) return '';
      const msk = getMskNow();
      const hasToday = DAY_KEYS.includes(msk.dateStr);
      if (hasToday && msk.minutes < 19 * 60 + 15) {
        return msk.dateStr;
      }
      const futureKeys = DAY_KEYS.filter(k => {
        const dt = parseDateKey(k);
        return dt && dt.getTime() > msk.todayTs;
      });
      if (futureKeys.length) return futureKeys[0];
      if (hasToday) return msk.dateStr;
      return DAY_KEYS[DAY_KEYS.length - 1];
    }

    function collectRooms(classesObj) {
      const set = new Set();
      Object.values(classesObj || {}).forEach(lessons => {
        (lessons || []).forEach(l => {
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              const r = (sg.room || '').trim();
              if (r && r.toUpperCase() !== 'ДИСТ') set.add(r);
            });
          } else {
            const r = (l.room || '').trim();
            if (r && r.toUpperCase() !== 'ДИСТ') set.add(r);
          }
        });
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'ru', { numeric: true }));
    }

    function applySelectedDay(key) {
      selectedDayKey = key;
      const msk = getMskNow();

      if (key === WAITING_TOMORROW_KEY) {
        DATA = null;
        els.title.textContent = formatHumanTitle(msk.nextStudyDateStr, '');
        const updTime = (RAW_JSON && RAW_JSON.updated_at) || '';
        els.meta.textContent = formatShortUpdated(updTime);
        renderDaySwitcher();
        renderWaitingTomorrow();
        return;
      }

      if (!DAYS_MAP[key]) return;
      DATA = DAYS_MAP[key];
      ALL_TEACHERS = collectTeachers(DATA.classes);
      ALL_ROOMS = ALL_KNOWN_ROOMS.length ? ALL_KNOWN_ROOMS : collectRooms(DATA.classes);
      freeLessonNum = null;

      const dateVal = (DATA.meta && DATA.meta.date) || key;
      const wdVal = DATA.meta && DATA.meta.weekday;
      els.title.textContent = formatHumanTitle(dateVal, wdVal);

      const updTime = (RAW_JSON && RAW_JSON.updated_at) || DATA.updated_at || '';
      const offlineNote = navigator.onLine === false ? ' · офлайн' : '';
      els.meta.textContent = formatShortUpdated(updTime) + offlineNote;

      renderDaySwitcher();
      renderCurrentView();
    }

    // Всегда выводим удобное переключение Сегодня / Завтра
    function renderDaySwitcher() {
      if (!DAY_KEYS.length) {
        els.daySwitcher.style.display = 'none';
        return;
      }
      els.daySwitcher.style.display = 'flex';
      const msk = getMskNow();

      const items = DAY_KEYS.map(key => {
        const dt = parseDateKey(key);
        const wdShort = dt ? SHORT_WD[dt.getDay()] : '';
        let label = `${formatDdMm(key)} (${wdShort})`;
        let isFuture = false;

        if (key === msk.dateStr) {
          label = `Сегодня, ${formatDdMm(key)}`;
        } else if (key === msk.nextStudyDateStr && msk.isNextTomorrow) {
          label = `Завтра, ${formatDdMm(key)}`;
          isFuture = true;
        } else if (dt && dt.getTime() > msk.todayTs) {
          label = `${wdShort}, ${formatDdMm(key)}`;
          isFuture = true;
        }

        return `
          <button type="button" class="day-pill ${key === selectedDayKey ? 'active' : ''}" data-daykey="${escapeHtml(key)}">
            <span>${escapeHtml(label)}</span>
            ${isFuture ? '<span class="new-dot" title="Опубликовано"></span>' : ''}
          </button>
        `;
      });

      // Если будущего дня ещё нет в schedule.json — добавляем вкладку «Завтра» (или «На Пн»)
      const hasFutureDay = DAY_KEYS.some(k => {
        const dt = parseDateKey(k);
        return dt && dt.getTime() > msk.todayTs;
      });

      if (!hasFutureDay) {
        const nextDt = parseDateKey(msk.nextStudyDateStr);
        const wdShort = nextDt ? SHORT_WD[nextDt.getDay()] : '';
        const nextLabel = msk.isNextTomorrow
          ? `Завтра, ${formatDdMm(msk.nextStudyDateStr)}`
          : `На ${wdShort}, ${formatDdMm(msk.nextStudyDateStr)}`;

        items.push(`
          <button type="button" class="day-pill ${selectedDayKey === WAITING_TOMORROW_KEY ? 'active' : ''}" data-daykey="${WAITING_TOMORROW_KEY}">
            <span>${escapeHtml(nextLabel)}</span>
            <span class="wait-tag">ждём</span>
          </button>
        `);
      }

      els.daySwitcher.innerHTML = items.join('');
    }

    function renderWaitingTomorrow() {
      els.classControls.style.display = 'none';
      els.teacherPanel.style.display = 'none';
      els.roomsPanel.style.display = 'none';
      els.liveBar.style.display = 'none';

      const msk = getMskNow();
      const humanNext = formatHumanTitle(msk.nextStudyDateStr, '').toLowerCase();

      els.list.innerHTML = `
        <div class="waiting-card">
          <div class="waiting-title">Расписание на ${escapeHtml(humanNext)} ещё не выложили</div>
          <div class="waiting-sub">
            Бот автоматически проверяет группу в MAX каждые 30 минут. Как только школа опубликует новый PDF-файл, расписание сразу появится в этой вкладке (без удаления сегодняшнего дня).
          </div>
          <div class="waiting-actions">
            <button type="button" class="action-pill" id="refreshScheduleBtn">Проверить обновление</button>
            ${DAY_KEYS.length ? `<button type="button" class="action-pill secondary" id="backTodayBtn">Вернуться к текущему</button>` : ''}
          </div>
        </div>
      `;

      const refBtn = document.getElementById('refreshScheduleBtn');
      if (refBtn) {
        refBtn.addEventListener('click', () => {
          refBtn.textContent = 'Проверяем...';
          loadScheduleData(true);
        });
      }
      const backBtn = document.getElementById('backTodayBtn');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          applySelectedDay(DAY_KEYS[DAY_KEYS.length - 1]);
        });
      }
    }

    els.daySwitcher.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-daykey]');
      if (!btn) return;
      applySelectedDay(btn.getAttribute('data-daykey'));
    });

    function setDrawerState(open) {
      drawerOpen = open;
      els.classDrawer.classList.toggle('open', drawerOpen);
      els.pickerTrigger.classList.toggle('open', drawerOpen);
    }
    setDrawerState(drawerOpen);

    els.pickerTrigger.addEventListener('click', () => {
      setDrawerState(!drawerOpen);
    });

    function isScheduleMonday() {
      if (!DATA) return false;
      const wd = ((DATA.meta && DATA.meta.weekday) || '').toLowerCase();
      if (wd.includes('понедельник')) return true;
      if (wd && !wd.includes('понедельник')) return false;
      const dateRaw = (DATA.meta && DATA.meta.date) || DATA.source_file || '';
      const dt = parseDateKey(dateRaw);
      return dt ? dt.getDay() === 1 : false;
    }

    function getActiveBells() {
      return isScheduleMonday() ? BELLS_MONDAY : BELLS_REGULAR;
    }

    function toMin(hhmm) {
      if (!hhmm) return -1;
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function getBreakMinutes(bellsMap, numA, numB) {
      if (numB !== numA + 1 || !bellsMap[numA] || !bellsMap[numB]) return 0;
      return Math.max(0, toMin(bellsMap[numB].start) - toMin(bellsMap[numA].end));
    }

    function isScheduleToday() {
      if (!DATA || !DATA.meta || !DATA.meta.date) return false;
      return DATA.meta.date.trim() === getMskNow().dateStr;
    }

    function normStr(s) {
      return (s || '').toLowerCase().replace(/ё/g, 'е').trim();
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function roomBadge(room, clickable = true) {
      if (!room) return '';
      const r = room.trim();
      const up = r.toUpperCase();
      if (up === 'ДИСТ') {
        return `<span class="room dist">ДИСТ</span>`;
      }
      let cls = '';
      if (up.startsWith('Б.') || up.startsWith('B.')) cls = 'corp-b';
      else if (up.startsWith('В.')) cls = 'corp-v';
      if (clickable) {
        return `<button type="button" class="room ${cls}" data-jump-room="${escapeHtml(r)}" title="Открыть расписание кабинета ${escapeHtml(r)}">${escapeHtml(r)}</button>`;
      }
      return `<span class="room ${cls}">${escapeHtml(r)}</span>`;
    }

    function getRoomBuilding(room) {
      const up = (room || '').trim().toUpperCase();
      if (up.startsWith('А.') || up.startsWith('A.')) return 'А';
      if (up.startsWith('Б.') || up.startsWith('B.')) return 'Б';
      if (up.startsWith('В.')) return 'В';
      return 'other';
    }

    function getGrade(clsName) {
      const m = String(clsName).match(/^(\d+)/);
      return m ? m[1] : '';
    }

    function collectTeachers(classesObj) {
      const set = new Set();
      Object.values(classesObj || {}).forEach(lessons => {
        (lessons || []).forEach(l => {
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              if (sg.teacher && sg.teacher.trim()) set.add(sg.teacher.trim());
            });
          } else if (l.teacher && l.teacher.trim()) {
            set.add(l.teacher.trim());
          }
        });
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'ru'));
    }

    function numColHtml(bellsMap, num) {
      const b = bellsMap[num];
      return `
        <div class="num-col">
          <div class="num-val">${escapeHtml(num)}</div>
          ${b ? `<div class="t-start">${b.start}</div><div class="t-end">${b.end}</div>` : ''}
        </div>
      `;
    }

    function updateLiveBar(lessons) {
      if (!isScheduleToday() || !lessons || !lessons.length) {
        els.liveBar.style.display = 'none';
        return;
      }
      const bellsMap = getActiveBells();
      const nums = lessons.map(l => Number(l.lesson || l.num || 0)).filter(n => n > 0);
      if (!nums.length) {
        els.liveBar.style.display = 'none';
        return;
      }

      const cur = getMskNow().minutes;
      const firstNum = Math.min(...nums);
      const lastNum = Math.max(...nums);
      const firstStart = bellsMap[firstNum] ? toMin(bellsMap[firstNum].start) : -1;
      const lastEnd = bellsMap[lastNum] ? toMin(bellsMap[lastNum].end) : -1;

      if (firstStart > 0 && cur < firstStart) {
        const diff = firstStart - cur;
        if (diff <= 45) {
          els.liveBar.style.display = 'flex';
          els.liveLeft.innerHTML = `<span class="pulse"></span><span>${firstNum} урок начнётся через ${diff} мин</span>`;
          els.liveRight.textContent = bellsMap[firstNum].start;
          return;
        }
        els.liveBar.style.display = 'none';
        return;
      }

      if (lastEnd > 0 && cur >= lastEnd) {
        els.liveBar.style.display = 'none';
        return;
      }

      for (let i = 0; i < nums.length; i++) {
        const n = nums[i];
        const b = bellsMap[n];
        if (!b) continue;
        const s = toMin(b.start), e = toMin(b.end);
        if (cur >= s && cur < e) {
          els.liveBar.style.display = 'flex';
          els.liveLeft.innerHTML = `<span class="pulse"></span><span>Идёт ${n} урок · ещё ${e - cur} мин</span>`;
          els.liveRight.textContent = `до ${b.end}`;
          return;
        }
        if (i + 1 < nums.length) {
          const nextN = nums[i + 1];
          const nextB = bellsMap[nextN];
          if (nextB && cur >= e && cur < toMin(nextB.start)) {
            els.liveBar.style.display = 'flex';
            els.liveLeft.innerHTML = `<span class="pulse"></span><span>Перемена · ${nextN} урок через ${toMin(nextB.start) - cur} мин</span>`;
            els.liveRight.textContent = `в ${nextB.start}`;
            return;
          }
        }
      }

      els.liveBar.style.display = 'none';
    }

    function setMode(nextMode) {
      mode = nextMode;
      els.tabClass.classList.toggle('active', mode === 'class');
      els.tabTeacher.classList.toggle('active', mode === 'teacher');
      els.tabRooms.classList.toggle('active', mode === 'rooms');

      if (selectedDayKey === WAITING_TOMORROW_KEY) {
        renderWaitingTomorrow();
        return;
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      if (selectedDayKey === WAITING_TOMORROW_KEY) {
        renderWaitingTomorrow();
        return;
      }
      els.classControls.style.display = mode === 'class' ? 'block' : 'none';
      els.teacherPanel.style.display = mode === 'teacher' ? 'block' : 'none';
      els.roomsPanel.style.display = mode === 'rooms' ? 'block' : 'none';

      if (mode === 'class') renderClassUI();
      else if (mode === 'teacher') renderTeacherUI();
      else renderRoomsUI();
    }

    function pluralLessons(n) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return `${n} урок`;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return `${n} урока`;
      return `${n} уроков`;
    }

    function renderClassUI() {
      if (!DATA || !DATA.classes) return;
      const allClasses = Object.keys(DATA.classes);
      if (!allClasses.length) {
        els.list.innerHTML = '<div class="empty-state">Расписание пока пустое</div>';
        return;
      }

      if (!DATA.classes[currentClass]) currentClass = allClasses[0];
      currentGrade = getGrade(currentClass) || currentGrade;
      localStorage.setItem('selected_class', currentClass);
      localStorage.setItem('saved_grade', currentGrade);

      els.currentClassLabel.textContent = currentClass;

      const grades = Array.from(new Set(allClasses.map(getGrade).filter(Boolean)))
        .sort((a, b) => Number(a) - Number(b));

      els.gradeRow.innerHTML = grades.map(g =>
        `<button type="button" class="grade-chip ${g === currentGrade ? 'active' : ''}" data-grade="${escapeHtml(g)}">${escapeHtml(g)}</button>`
      ).join('');

      const gradeClasses = allClasses.filter(c => getGrade(c) === currentGrade);
      els.classGrid.innerHTML = gradeClasses.map(c =>
        `<button type="button" class="class-chip ${c === currentClass ? 'active' : ''}" data-class="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join('');

      const lessons = DATA.classes[currentClass] || [];
      const bellsMap = getActiveBells();
      const nums = lessons.map(l => Number(l.lesson || l.num || 0)).filter(n => n > 0);

      if (nums.length) {
        const firstN = Math.min(...nums), lastN = Math.max(...nums);
        const spanTxt = (bellsMap[firstN] && bellsMap[lastN]) ? `${bellsMap[firstN].start}–${bellsMap[lastN].end}` : '';
        els.classSummary.textContent = `${pluralLessons(lessons.length)}${spanTxt ? ' · ' + spanTxt : ''}`;
      } else {
        els.classSummary.textContent = 'нет уроков';
      }

      updateLiveBar(lessons);

      if (!lessons.length) {
        els.list.innerHTML = '<div class="empty-state">Уроков для выбранного класса нет</div>';
        return;
      }

      const todayMode = isScheduleToday();
      const curMin = getMskNow().minutes;
      const blocks = [];

      lessons.forEach((l, idx) => {
        const num = Number(l.lesson || l.num || (idx + 1));
        const b = bellsMap[num];
        const sMin = b ? toMin(b.start) : -1;
        const eMin = b ? toMin(b.end) : -1;
        const isNow = todayMode && sMin >= 0 && curMin >= sMin && curMin < eMin;
        const isPast = todayMode && eMin >= 0 && curMin >= eMin;
        const pct = isNow ? Math.min(100, Math.max(4, Math.round(((curMin - sMin) / (eMin - sMin)) * 100))) : 0;

        if (idx > 0) {
          const prevNum = Number(lessons[idx - 1].lesson || lessons[idx - 1].num || idx);
          if (num > prevNum + 1) {
            blocks.push(`<div class="divider-note">Окно · ${prevNum + 1} урок свободен</div>`);
          } else {
            const brk = getBreakMinutes(bellsMap, prevNum, num);
            if (brk >= 20) {
              blocks.push(`<div class="divider-note">Перемена ${brk} мин</div>`);
            }
          }
        }

        const stateCls = isNow ? 'is-now' : (isPast ? 'is-past' : '');
        const progHtml = isNow ? `<div class="lesson-progress" style="width:${pct}%"></div>` : '';

        if (Array.isArray(l.subgroups) && l.subgroups.length) {
          blocks.push(`
            <div class="lesson-card ${stateCls}">
              ${numColHtml(bellsMap, num)}
              <div class="body-col">
                <div class="sg-split">
                  ${l.subgroups.map(sg => `
                    <div class="sg-row">
                      <div>
                        <div class="subj"><span class="sg-num-pill">${escapeHtml(sg.group)} гр</span>${escapeHtml(sg.subject || 'Урок')}</div>
                        ${sg.teacher ? `<button type="button" class="teacher-btn" data-jump-teacher="${escapeHtml(sg.teacher)}">${escapeHtml(sg.teacher)}</button>` : ''}
                      </div>
                      ${roomBadge(sg.room)}
                    </div>
                  `).join('')}
                </div>
              </div>
              ${progHtml}
            </div>
          `);
        } else {
          blocks.push(`
            <div class="lesson-card ${stateCls}">
              ${numColHtml(bellsMap, num)}
              <div class="body-col">
                <div class="row-main">
                  <div class="subj">${escapeHtml(l.subject || l.text || '')}</div>
                  ${roomBadge(l.room)}
                </div>
                ${l.teacher ? `<button type="button" class="teacher-btn" data-jump-teacher="${escapeHtml(l.teacher)}">${escapeHtml(l.teacher)}</button>` : ''}
              </div>
              ${progHtml}
            </div>
          `);
        }
      });

      els.list.innerHTML = `<div class="lessons-stack">${blocks.join('')}</div>`;
    }

    function renderTeacherUI() {
      if (!DATA || !DATA.classes) return;
      const rawQuery = els.teacherInput.value;
      els.clearTeacherBtn.style.display = rawQuery ? 'block' : 'none';
      const query = normStr(rawQuery);
      const filteredTeachers = ALL_TEACHERS.filter(t => !query || normStr(t).includes(query));

      if ((!currentTeacher || !filteredTeachers.includes(currentTeacher)) && filteredTeachers.length) {
        currentTeacher = filteredTeachers[0];
      }

      els.teacherChips.innerHTML = filteredTeachers.map(t =>
        `<button type="button" class="chip-btn ${t === currentTeacher ? 'active' : ''}" data-teacher="${escapeHtml(t)}">${escapeHtml(t)}</button>`
      ).join('');

      const targetExact = filteredTeachers.includes(currentTeacher) ? currentTeacher : '';
      const hits = [];

      Object.entries(DATA.classes).forEach(([cls, lessons]) => {
        (lessons || []).forEach(l => {
          const num = Number(l.lesson || l.num || 0);
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              const tName = (sg.teacher || '').trim();
              const matched = targetExact ? (tName === targetExact) : (query && normStr(tName).includes(query));
              if (matched) {
                hits.push({ lesson: num, num, cls: `${cls} (${sg.group} гр)`, subject: sg.subject, room: sg.room, teacher: tName });
              }
            });
          } else {
            const tName = (l.teacher || '').trim();
            const matched = targetExact
              ? (tName === targetExact)
              : (query && (normStr(tName).includes(query) || normStr(l.text).includes(query)));
            if (matched) {
              hits.push({ lesson: num, num, cls, subject: l.subject || l.text, room: l.room, teacher: tName });
            }
          }
        });
      });

      hits.sort((a, b) => a.num - b.num || a.cls.localeCompare(b.cls, 'ru'));
      updateLiveBar(hits);

      if (!hits.length) {
        els.list.innerHTML = '<div class="empty-state">Уроков для выбранного учителя не найдено</div>';
        return;
      }

      const bellsMap = getActiveBells();
      const todayMode = isScheduleToday();
      const curMin = getMskNow().minutes;
      const blocks = [];

      hits.forEach((h, idx) => {
        const b = bellsMap[h.num];
        const sMin = b ? toMin(b.start) : -1;
        const eMin = b ? toMin(b.end) : -1;
        const isNow = todayMode && sMin >= 0 && curMin >= sMin && curMin < eMin;
        const isPast = todayMode && eMin >= 0 && curMin >= eMin;

        if (idx > 0) {
          const prevNum = hits[idx - 1].num;
          if (h.num > prevNum + 1) {
            blocks.push(`<div class="divider-note">Окно · ${h.num - prevNum - 1} ур.</div>`);
          } else {
            const brk = getBreakMinutes(bellsMap, prevNum, h.num);
            if (brk >= 20) {
              blocks.push(`<div class="divider-note">Перемена ${brk} мин</div>`);
            }
          }
        }

        blocks.push(`
          <div class="lesson-card ${isNow ? 'is-now' : (isPast ? 'is-past' : '')}">
            ${numColHtml(bellsMap, h.num)}
            <div class="body-col">
              <div class="row-main">
                <div class="subj">${escapeHtml(h.cls)} · ${escapeHtml(h.subject || '')}</div>
                ${roomBadge(h.room)}
              </div>
              <div class="teacher-btn" style="cursor:default;text-decoration:none">${escapeHtml(h.teacher || '')}</div>
            </div>
          </div>
        `);
      });

      els.list.innerHTML = `<div class="lessons-stack">${blocks.join('')}</div>`;
    }

    // Раздел Кабинеты: Свободные кабинеты на уроке + Занятость конкретного кабинета на весь день
    function renderRoomsUI() {
      if (!DATA || !DATA.classes) return;
      els.liveBar.style.display = 'none';

      els.rmFreeBtn.classList.toggle('active', roomsSubMode === 'free');
      els.rmBusyBtn.classList.toggle('active', roomsSubMode === 'busy');
      els.freeRoomsControls.style.display = roomsSubMode === 'free' ? 'flex' : 'none';
      els.busyRoomControls.style.display = roomsSubMode === 'busy' ? 'block' : 'none';

      const bellsMap = getActiveBells();

      if (roomsSubMode === 'free') {
        // Определяем список уроков дня (1..12)
        let maxLesson = 8;
        Object.values(DATA.classes).forEach(lessons => {
          (lessons || []).forEach(l => {
            const n = Number(l.lesson || l.num || 0);
            if (n > maxLesson) maxLesson = n;
          });
        });

        if (!freeLessonNum) {
          // Если сейчас идёт урок или перемена — выбираем его по умолчанию
          const curMin = getMskNow().minutes;
          freeLessonNum = 1;
          if (isScheduleToday()) {
            for (let n = 1; n <= maxLesson; n++) {
              const b = bellsMap[n];
              if (b && curMin < toMin(b.end)) {
                freeLessonNum = n;
                break;
              }
            }
          }
        }

        const lessonBtns = [];
        for (let n = 1; n <= maxLesson; n++) {
          const b = bellsMap[n];
          const timeHint = b ? ` · ${b.start}` : '';
          lessonBtns.push(`
            <button type="button" class="chip-btn ${n === freeLessonNum ? 'active' : ''}" data-freelesson="${n}">
              ${n} урок${timeHint}
            </button>
          `);
        }
        els.freeLessonChips.innerHTML = lessonBtns.join('');

        const corps = [
          { id: 'all', label: 'Все корпуса' },
          { id: 'А', label: 'Корпус А' },
          { id: 'Б', label: 'Корпус Б' },
          { id: 'В', label: 'Корпус В' }
        ];
        els.freeCorpChips.innerHTML = corps.map(c =>
          `<button type="button" class="chip-btn ${freeBuilding === c.id ? 'active' : ''}" data-freecorp="${c.id}">${c.label}</button>`
        ).join('');

        // Находим занятые кабинеты на выбранном уроке
        const busySet = new Set();
        Object.values(DATA.classes).forEach(lessons => {
          (lessons || []).forEach(l => {
            const n = Number(l.lesson || l.num || 0);
            if (n !== freeLessonNum) return;
            if (Array.isArray(l.subgroups)) {
              l.subgroups.forEach(sg => {
                if (sg.room) busySet.add(sg.room.trim());
              });
            } else if (l.room) {
              busySet.add(l.room.trim());
            }
          });
        });

        const freeRooms = ALL_ROOMS.filter(r => {
          if (busySet.has(r)) return false;
          if (freeBuilding !== 'all' && getRoomBuilding(r) !== freeBuilding) return false;
          return true;
        });

        const bInfo = bellsMap[freeLessonNum];
        const spanLabel = bInfo ? `${bInfo.start}–${bInfo.end}` : '';

        if (!freeRooms.length) {
          els.list.innerHTML = `<div class="empty-state">Свободных кабинетов на ${freeLessonNum} уроке не найдено</div>`;
          return;
        }

        els.list.innerHTML = `
          <div class="free-rooms-card">
            <div class="free-rooms-title">
              <span>Свободны на ${freeLessonNum} уроке (${freeRooms.length})</span>
              <span>${spanLabel}</span>
            </div>
            <div class="free-rooms-grid">
              ${freeRooms.map(r => roomBadge(r, true)).join('')}
            </div>
          </div>
        `;
        return;
      }

      // Режим занятости конкретного кабинета по номеру
      const rawQ = els.roomInput.value;
      els.clearRoomBtn.style.display = rawQ ? 'block' : 'none';
      const q = normStr(rawQ);
      const filteredRooms = ALL_ROOMS.filter(r => !q || normStr(r).includes(q));

      if ((!currentRoom || !filteredRooms.includes(currentRoom)) && filteredRooms.length) {
        currentRoom = filteredRooms[0];
      }

      els.roomChips.innerHTML = filteredRooms.map(r =>
        `<button type="button" class="chip-btn ${r === currentRoom ? 'active' : ''}" data-room="${escapeHtml(r)}">${escapeHtml(r)}</button>`
      ).join('');

      const targetRoom = filteredRooms.includes(currentRoom) ? currentRoom : '';
      if (!targetRoom) {
        els.list.innerHTML = '<div class="empty-state">Кабинет не найден</div>';
        return;
      }

      const hits = [];
      Object.entries(DATA.classes).forEach(([cls, lessons]) => {
        (lessons || []).forEach(l => {
          const num = Number(l.lesson || l.num || 0);
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              if ((sg.room || '').trim() === targetRoom) {
                hits.push({ num, cls: `${cls} (${sg.group} гр)`, subject: sg.subject, teacher: sg.teacher, room: targetRoom });
              }
            });
          } else if ((l.room || '').trim() === targetRoom) {
            hits.push({ num, cls, subject: l.subject || l.text, teacher: l.teacher, room: targetRoom });
          }
        });
      });

      hits.sort((a, b) => a.num - b.num || a.cls.localeCompare(b.cls, 'ru'));

      if (!hits.length) {
        els.list.innerHTML = `<div class="empty-state">Кабинет ${escapeHtml(targetRoom)} сегодня полностью свободен</div>`;
        return;
      }

      const todayMode = isScheduleToday();
      const curMin = getMskNow().minutes;
      const blocks = [];

      hits.forEach((h, idx) => {
        const b = bellsMap[h.num];
        const sMin = b ? toMin(b.start) : -1;
        const eMin = b ? toMin(b.end) : -1;
        const isNow = todayMode && sMin >= 0 && curMin >= sMin && curMin < eMin;
        const isPast = todayMode && eMin >= 0 && curMin >= eMin;

        if (idx > 0 && h.num > hits[idx - 1].num + 1) {
          const freeFrom = hits[idx - 1].num + 1;
          const freeTo = h.num - 1;
          const freeTxt = freeFrom === freeTo ? `${freeFrom} урок` : `${freeFrom}–${freeTo} уроки`;
          blocks.push(`<div class="divider-note">Кабинет свободен (${freeTxt})</div>`);
        }

        blocks.push(`
          <div class="lesson-card ${isNow ? 'is-now' : (isPast ? 'is-past' : '')}">
            ${numColHtml(bellsMap, h.num)}
            <div class="body-col">
              <div class="row-main">
                <div class="subj">${escapeHtml(h.cls)} · ${escapeHtml(h.subject || '')}</div>
                ${roomBadge(h.room, false)}
              </div>
              ${h.teacher ? `<button type="button" class="teacher-btn" data-jump-teacher="${escapeHtml(h.teacher)}">${escapeHtml(h.teacher)}</button>` : ''}
            </div>
          </div>
        `);
      });

      els.list.innerHTML = `<div class="lessons-stack">${blocks.join('')}</div>`;
    }

    function buildShareText() {
      if (!DATA || !DATA.classes) return '';
      const bellsMap = getActiveBells();
      const dateStr = (DATA.meta && DATA.meta.date) ? DATA.meta.date : '';
      const wd = (DATA.meta && DATA.meta.weekday) ? ` (${DATA.meta.weekday})` : '';
      const lessons = DATA.classes[currentClass] || [];
      const lines = [`Расписание ${currentClass} на ${dateStr}${wd}:`];

      lessons.forEach(l => {
        const n = l.lesson || l.num;
        const t = bellsMap[n] ? ` ${bellsMap[n].start}–${bellsMap[n].end}` : '';
        if (Array.isArray(l.subgroups)) {
          lines.push(`${n}.${t}:`);
          l.subgroups.forEach(sg => {
            lines.push(`  • ${sg.group} гр: ${sg.subject} [${sg.room || '—'}]`);
          });
        } else {
          lines.push(`${n}.${t} ${l.subject || l.text} [${l.room || '—'}]`);
        }
      });
      lines.push(`\n${location.origin}${location.pathname}`);
      return lines.join('\n');
    }

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add('show');
      setTimeout(() => els.toast.classList.remove('show'), 2000);
    }

    els.shareBtn.addEventListener('click', async () => {
      const text = buildShareText();
      if (navigator.share) {
        try {
          await navigator.share({ title: els.title.textContent, text });
          return;
        } catch (_) {}
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast('Расписание скопировано');
      } catch (_) {
        showToast('Не удалось скопировать');
      }
    });

    els.tabClass.addEventListener('click', () => setMode('class'));
    els.tabTeacher.addEventListener('click', () => setMode('teacher'));
    els.tabRooms.addEventListener('click', () => setMode('rooms'));

    els.rmFreeBtn.addEventListener('click', () => {
      roomsSubMode = 'free';
      renderRoomsUI();
    });
    els.rmBusyBtn.addEventListener('click', () => {
      roomsSubMode = 'busy';
      renderRoomsUI();
    });

    els.freeLessonChips.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-freelesson]');
      if (!btn) return;
      freeLessonNum = Number(btn.getAttribute('data-freelesson'));
      renderRoomsUI();
    });

    els.freeCorpChips.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-freecorp]');
      if (!btn) return;
      freeBuilding = btn.getAttribute('data-freecorp');
      renderRoomsUI();
    });

    els.roomChips.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-room]');
      if (!btn) return;
      currentRoom = btn.getAttribute('data-room');
      renderRoomsUI();
    });

    els.roomInput.addEventListener('input', () => {
      currentRoom = '';
      renderRoomsUI();
    });

    els.clearRoomBtn.addEventListener('click', () => {
      els.roomInput.value = '';
      currentRoom = '';
      renderRoomsUI();
      els.roomInput.focus();
    });

    // Быстрый переход к учителю или кабинету по клику из карточки урока
    els.list.addEventListener('click', (e) => {
      const jumpTeacher = e.target.closest('[data-jump-teacher]');
      if (jumpTeacher) {
        currentTeacher = jumpTeacher.getAttribute('data-jump-teacher');
        localStorage.setItem('selected_teacher', currentTeacher);
        els.teacherInput.value = '';
        setMode('teacher');
        return;
      }
      const jumpRoom = e.target.closest('[data-jump-room]');
      if (jumpRoom) {
        currentRoom = jumpRoom.getAttribute('data-jump-room');
        els.roomInput.value = '';
        roomsSubMode = 'busy';
        setMode('rooms');
      }
    });

    els.gradeRow.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-grade]');
      if (!btn || !DATA) return;
      currentGrade = btn.getAttribute('data-grade');
      renderClassUI();
    });

    els.classGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-class]');
      if (!btn) return;
      currentClass = btn.getAttribute('data-class');
      setDrawerState(false);
      renderClassUI();
    });

    els.teacherChips.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-teacher]');
      if (!btn) return;
      currentTeacher = btn.getAttribute('data-teacher');
      localStorage.setItem('selected_teacher', currentTeacher);
      renderTeacherUI();
    });

    els.teacherInput.addEventListener('input', () => {
      currentTeacher = '';
      renderTeacherUI();
    });

    els.clearTeacherBtn.addEventListener('click', () => {
      els.teacherInput.value = '';
      currentTeacher = '';
      renderTeacherUI();
      els.teacherInput.focus();
    });

    function loadScheduleData(manualRefresh = false) {
      lastFetchTime = Date.now();
      fetch('./schedule.json?t=' + Date.now())
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(json => {
          RAW_JSON = json;
          DAYS_MAP = {};
          const roomUnion = new Set();

          if (json.days && typeof json.days === 'object' && Object.keys(json.days).length) {
            Object.entries(json.days).forEach(([k, v]) => {
              if (v && v.classes) {
                DAYS_MAP[k] = v;
                collectRooms(v.classes).forEach(r => roomUnion.add(r));
              }
            });
          } else if (json.classes) {
            const singleKey = (json.meta && json.meta.date) || 'current';
            DAYS_MAP[singleKey] = json;
            collectRooms(json.classes).forEach(r => roomUnion.add(r));
          }

          ALL_KNOWN_ROOMS = Array.from(roomUnion).sort((a, b) => a.localeCompare(b, 'ru', { numeric: true }));

          DAY_KEYS = Object.keys(DAYS_MAP).sort((a, b) => {
            const da = parseDateKey(a), db = parseDateKey(b);
            return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
          });

          if (manualRefresh && selectedDayKey === WAITING_TOMORROW_KEY) {
            const msk = getMskNow();
            const futureFound = DAY_KEYS.find(k => {
              const dt = parseDateKey(k);
              return dt && dt.getTime() > msk.todayTs;
            });
            if (futureFound) {
              applySelectedDay(futureFound);
              showToast('Новое расписание загружено!');
              return;
            }
            applySelectedDay(WAITING_TOMORROW_KEY);
            showToast('В MAX пока нет нового файла');
            return;
          }

          const targetKey = (selectedDayKey && DAYS_MAP[selectedDayKey]) ? selectedDayKey : pickInitialDayKey();
          if (targetKey) {
            applySelectedDay(targetKey);
          }
        })
        .catch(err => {
          els.meta.textContent = 'Ошибка загрузки: ' + err.message;
        });
    }

    // Автопроверка свежего расписания при разворачивании приложения из фона
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - lastFetchTime > 60000) {
        loadScheduleData(false);
      }
    });

    setInterval(() => {
      if (DATA) {
        renderDaySwitcher();
        renderCurrentView();
      }
    }, 30000);

    loadScheduleData(false);
  </script>
</body>
</html>
