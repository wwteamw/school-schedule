<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание уроков — Школа русской культуры</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e14;
      --card: #151923;
      --card-sub: #0f131b;
      --border: #252b3b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --dist-bg: rgba(245, 158, 11, 0.18);
      --dist-text: #fcd34d;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .school { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #60a5fa; margin-bottom: 4px; }
    h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.2; }
    .meta { color: var(--muted); font-size: 13px; }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .tabs { display: flex; background: var(--card); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
    .tab { background: transparent; color: var(--muted); border: none; padding: 8px 13px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tab.active { background: var(--accent); color: #fff; }
    a.btn-pdf { background: var(--card); border: 1px solid var(--border); color: var(--text); text-decoration: none; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    a.btn-pdf:hover { border-color: var(--accent); }

    .panel { margin-bottom: 16px; }
    .grade-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .chip:hover { border-color: #3b445e; }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .class-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .class-chip { background: var(--card-sub); color: var(--muted); border: 1px solid var(--border); padding: 7px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .class-chip.active { background: #f8fafc; color: #0f172a; border-color: #fff; font-weight: 700; }

    .search-box { position: relative; margin-bottom: 10px; }
    input, select { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    select option { background: #151923; color: #f1f5f9; }
    .teacher-chips { display: flex; gap: 6px; flex-wrap: wrap; max-height: 156px; overflow-y: auto; padding: 2px 0; }
    .teacher-chip { background: var(--card); color: #cbd5e1; border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .teacher-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .section-head { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 10px; }
    .section-title { font-size: 17px; font-weight: 700; }
    .count-pill { font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; }

    .lesson { background: var(--card); border: 1px solid var(--border); padding: 12px 14px; border-radius: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
    .num { font-weight: 700; color: #60a5fa; min-width: 32px; height: 32px; background: var(--accent-soft); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
    .body { flex: 1; min-width: 0; }
    .row-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .subj { font-weight: 600; font-size: 15px; line-height: 1.35; }
    .teacher { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: #93c5fd; white-space: nowrap; flex-shrink: 0; }
    .badge.dist { background: var(--dist-bg); color: var(--dist-text); }
    .subgroups { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 8px; width: 100%; }
    .sg-card { background: var(--card-sub); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; }
    .sg-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px; gap: 6px; }
    .empty { color: var(--muted); text-align: center; padding: 28px 16px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <div class="school" id="schoolName">МАОУ «Школа русской культуры»</div>
        <h1 id="title">Расписание уроков</h1>
        <div class="meta" id="meta">Загрузка расписания...</div>
      </div>
      <div class="top-actions">
        <div class="tabs">
          <button class="tab active" id="tabClass" type="button">По классам</button>
          <button class="tab" id="tabTeacher" type="button">По учителям</button>
        </div>
        <a class="btn-pdf" href="./latest.pdf" target="_blank">📄 PDF</a>
      </div>
    </div>

    <!-- Панель выбора класса -->
    <div class="panel" id="classPanel">
      <div class="grade-row" id="gradeRow"></div>
      <div class="class-row" id="classRow"></div>
      <select id="classSelect" aria-label="Выбор класса"></select>
    </div>

    <!-- Панель поиска учителя -->
    <div class="panel" id="teacherPanel" style="display:none">
      <div class="search-box">
        <input id="teacherInput" type="search" autocomplete="off" placeholder="Начните вводить фамилию или выберите ниже (например: Бурый, Сенькина)..." />
      </div>
      <div class="teacher-chips" id="teacherChips"></div>
    </div>

    <div class="section-head">
      <div class="section-title" id="sectionTitle">—</div>
      <div class="count-pill" id="countPill">0 ур.</div>
    </div>

    <div id="list"></div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const els = {
      school: document.getElementById('schoolName'),
      title: document.getElementById('title'),
      meta: document.getElementById('meta'),
      tabClass: document.getElementById('tabClass'),
      tabTeacher: document.getElementById('tabTeacher'),
      classPanel: document.getElementById('classPanel'),
      teacherPanel: document.getElementById('teacherPanel'),
      gradeRow: document.getElementById('gradeRow'),
      classRow: document.getElementById('classRow'),
      classSelect: document.getElementById('classSelect'),
      teacherInput: document.getElementById('teacherInput'),
      teacherChips: document.getElementById('teacherChips'),
      sectionTitle: document.getElementById('sectionTitle'),
      countPill: document.getElementById('countPill'),
      list: document.getElementById('list'),
    };

    let DATA = null;
    let ALL_TEACHERS = [];
    let mode = 'class';
    let currentGrade = localStorage.getItem('saved_grade') || '5';
    let currentClass = localStorage.getItem('selected_class') || '5 А';
    let currentTeacher = localStorage.getItem('selected_teacher') || '';

    function normStr(s) {
      return (s || '').toLowerCase().replace(/ё/g, 'е').trim();
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function badgeHtml(room) {
      if (!room) return '';
      const isDist = room.toUpperCase() === 'ДИСТ';
      return `<span class="badge ${isDist ? 'dist' : ''}">${isDist ? '💻 ДИСТ' : 'каб. ' + escapeHtml(room)}</span>`;
    }

    function getGrade(clsName) {
      const m = String(clsName).match(/^(\d+)/);
      return m ? m[1] : '';
    }

    function collectTeachers(classesObj) {
      const set = new Set();
      Object.values(classesObj || {}).forEach(lessons => {
        (lessons || []).forEach(l => {
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              if (sg.teacher && sg.teacher.trim()) set.add(sg.teacher.trim());
            });
          } else if (l.teacher && l.teacher.trim()) {
            set.add(l.teacher.trim());
          }
        });
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'ru'));
    }

    function setMode(nextMode) {
      mode = nextMode;
      els.classPanel.style.display = mode === 'class' ? 'block' : 'none';
      els.teacherPanel.style.display = mode === 'teacher' ? 'block' : 'none';
      els.tabClass.classList.toggle('active', mode === 'class');
      els.tabTeacher.classList.toggle('active', mode === 'teacher');
      if (mode === 'class') {
        renderClassUI();
      } else {
        renderTeacherUI();
      }
    }

    function renderClassUI() {
      if (!DATA || !DATA.classes) return;
      const allClasses = Object.keys(DATA.classes);
      if (!allClasses.length) {
        els.sectionTitle.textContent = 'Нет данных';
        els.countPill.textContent = '0 ур.';
        els.list.innerHTML = '<div class="empty">Расписание пока пустое</div>';
        return;
      }

      if (!DATA.classes[currentClass]) {
        currentClass = allClasses[0];
      }
      currentGrade = getGrade(currentClass) || currentGrade;
      localStorage.setItem('selected_class', currentClass);
      localStorage.setItem('saved_grade', currentGrade);

      const grades = Array.from(new Set(allClasses.map(getGrade).filter(Boolean)))
        .sort((a, b) => Number(a) - Number(b));

      els.gradeRow.innerHTML = grades.map(g =>
        `<button type="button" class="chip ${g === currentGrade ? 'active' : ''}" data-grade="${escapeHtml(g)}">${escapeHtml(g)} параллель</button>`
      ).join('');

      const gradeClasses = allClasses.filter(c => getGrade(c) === currentGrade);
      els.classRow.innerHTML = gradeClasses.map(c =>
        `<button type="button" class="class-chip ${c === currentClass ? 'active' : ''}" data-class="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join('');

      els.classSelect.innerHTML = allClasses.map(c =>
        `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`
      ).join('');
      els.classSelect.value = currentClass;

      const lessons = DATA.classes[currentClass] || [];
      els.sectionTitle.textContent = `Класс ${currentClass}`;
      els.countPill.textContent = lessons.length
        ? `${lessons.length} ур. (${lessons[0].lesson || lessons[0].num}–${lessons[lessons.length - 1].lesson || lessons[lessons.length - 1].num} урок)`
        : 'нет уроков';

      if (!lessons.length) {
        els.list.innerHTML = '<div class="empty">Для выбранного класса уроков не найдено</div>';
        return;
      }

      els.list.innerHTML = lessons.map((l, i) => {
        const num = l.lesson || l.num || (i + 1);
        if (Array.isArray(l.subgroups) && l.subgroups.length) {
          return `
            <div class="lesson">
              <div class="num">${escapeHtml(num)}</div>
              <div class="subgroups">
                ${l.subgroups.map(sg => `
                  <div class="sg-card">
                    <div class="sg-head"><span>${escapeHtml(sg.group)} подгруппа</span>${badgeHtml(sg.room)}</div>
                    <div class="subj">${escapeHtml(sg.subject || 'Урок')}</div>
                    <div class="teacher">${escapeHtml(sg.teacher || '')}</div>
                  </div>
                `).join('')}
              </div>
            </div>`;
        }
        if (l.subject || l.room || l.teacher) {
          return `
            <div class="lesson">
              <div class="num">${escapeHtml(num)}</div>
              <div class="body">
                <div class="row-main">
                  <div class="subj">${escapeHtml(l.subject || l.text || '')}</div>
                  ${badgeHtml(l.room)}
                </div>
                <div class="teacher">${escapeHtml(l.teacher || '')}</div>
              </div>
            </div>`;
        }
        return `
          <div class="lesson">
            <div class="num">${escapeHtml(num)}</div>
            <div class="body"><div class="subj">${escapeHtml(l.text || '')}</div></div>
          </div>`;
      }).join('');
    }

    function renderTeacherUI() {
      if (!DATA || !DATA.classes) return;
      const query = normStr(els.teacherInput.value);
      const filteredTeachers = ALL_TEACHERS.filter(t => !query || normStr(t).includes(query));

      if ((!currentTeacher || !filteredTeachers.includes(currentTeacher)) && filteredTeachers.length) {
        currentTeacher = filteredTeachers[0];
      }

      els.teacherChips.innerHTML = filteredTeachers.map(t =>
        `<button type="button" class="teacher-chip ${t === currentTeacher ? 'active' : ''}" data-teacher="${escapeHtml(t)}">${escapeHtml(t)}</button>`
      ).join('');

      if (!filteredTeachers.length && !query) {
        els.sectionTitle.textContent = 'Поиск учителя';
        els.countPill.textContent = '0 ур.';
        els.list.innerHTML = '<div class="empty">Список учителей пуст</div>';
        return;
      }

      // Если выбран конкретный учитель из чипов — показываем его уроки; иначе ищем по подстроке в text/teacher
      const targetExact = filteredTeachers.includes(currentTeacher) ? currentTeacher : '';
      els.sectionTitle.textContent = targetExact || (els.teacherInput.value.trim() ? `Поиск: ${els.teacherInput.value.trim()}` : 'Выберите учителя');

      const hits = [];
      Object.entries(DATA.classes).forEach(([cls, lessons]) => {
        (lessons || []).forEach(l => {
          const num = Number(l.lesson || l.num || 0);
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              const tName = (sg.teacher || '').trim();
              const matched = targetExact ? (tName === targetExact) : (query && normStr(tName).includes(query));
              if (matched) {
                hits.push({ num, cls: `${cls} (${sg.group} гр.)`, subject: sg.subject, room: sg.room, teacher: tName });
              }
            });
          } else {
            const tName = (l.teacher || '').trim();
            const matched = targetExact
              ? (tName === targetExact)
              : (query && (normStr(tName).includes(query) || normStr(l.text).includes(query)));
            if (matched) {
              hits.push({ num, cls, subject: l.subject || l.text, room: l.room, teacher: tName });
            }
          }
        });
      });

      hits.sort((a, b) => a.num - b.num || a.cls.localeCompare(b.cls, 'ru'));
      els.countPill.textContent = `${hits.length} ур.`;

      if (!hits.length) {
        els.list.innerHTML = '<div class="empty">Уроков для этого учителя не найдено</div>';
        return;
      }

      els.list.innerHTML = hits.map(h => `
        <div class="lesson">
          <div class="num">${escapeHtml(h.num || '•')}</div>
          <div class="body">
            <div class="row-main">
              <div class="subj">${escapeHtml(h.cls)} — ${escapeHtml(h.subject || '')}</div>
              ${badgeHtml(h.room)}
            </div>
            <div class="teacher">${escapeHtml(h.teacher || '')}</div>
          </div>
        </div>
      `).join('');
    }

    // Обработчики событий через делегирование
    els.tabClass.addEventListener('click', () => setMode('class'));
    els.tabTeacher.addEventListener('click', () => setMode('teacher'));

    els.gradeRow.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-grade]');
      if (!btn || !DATA) return;
      currentGrade = btn.getAttribute('data-grade');
      const matching = Object.keys(DATA.classes).filter(c => getGrade(c) === currentGrade);
      if (matching.length && !matching.includes(currentClass)) {
        currentClass = matching[0];
      }
      renderClassUI();
    });

    els.classRow.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-class]');
      if (!btn) return;
      currentClass = btn.getAttribute('data-class');
      renderClassUI();
    });

    els.classSelect.addEventListener('change', (e) => {
      currentClass = e.target.value;
      currentGrade = getGrade(currentClass) || currentGrade;
      renderClassUI();
    });

    els.teacherChips.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-teacher]');
      if (!btn) return;
      currentTeacher = btn.getAttribute('data-teacher');
      localStorage.setItem('selected_teacher', currentTeacher);
      renderTeacherUI();
    });

    els.teacherInput.addEventListener('input', () => {
      currentTeacher = '';
      renderTeacherUI();
    });

    fetch('./schedule.json?t=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(json => {
        DATA = json;
        ALL_TEACHERS = collectTeachers(json.classes);
        if (json.meta && json.meta.school) {
          els.school.textContent = json.meta.school;
        }
        if (json.meta && json.meta.date) {
          els.title.textContent = `Расписание на ${json.meta.date}`;
        }
        const weekday = (json.meta && json.meta.weekday) ? ` (${json.meta.weekday})` : '';
        els.meta.textContent = `${json.source_file || 'Расписание'}${weekday} • Обновлено: ${json.updated_at || '—'}`;
        renderClassUI();
      })
      .catch(err => {
        els.meta.textContent = 'Ошибка загрузки schedule.json: ' + err.message;
      });
  </script>
</body>
</html>
