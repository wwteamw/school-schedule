<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="metaThemeColor" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ШРК Уроки">
  <title>Расписание — Школа русской культуры</title>
  <link rel="manifest" id="manifestLink" href="./manifest.json?v=3">
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=3">
  <link rel="shortcut icon" href="./icon.svg?v=3">
  <link rel="apple-touch-icon" sizes="180x180" id="appleTouchIcon" href="./icon.svg?v=3">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #090d16;
      --bg-elev: #111726;
      --card: #151d2e;
      --card-sub: #0e1422;
      --border: #232f46;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --now-border: #10b981;
      --now-soft: rgba(16, 185, 129, 0.14);
      --now-text: #34d399;
      --dist-bg: rgba(245, 158, 11, 0.18);
      --dist-text: #fbbf24;
      --corp-a-bg: rgba(59, 130, 246, 0.16);
      --corp-a-tx: #93c5fd;
      --corp-b-bg: rgba(168, 85, 247, 0.16);
      --corp-b-tx: #d8b4fe;
      --corp-v-bg: rgba(20, 184, 166, 0.16);
      --corp-v-tx: #5eead4;
      --tg-bg: rgba(56, 189, 248, 0.13);
      --tg-border: rgba(56, 189, 248, 0.34);
      --tg-tx: #38bdf8;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f1f5f9;
      --bg-elev: #ffffff;
      --card: #ffffff;
      --card-sub: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --now-border: #059669;
      --now-soft: rgba(5, 150, 105, 0.1);
      --now-text: #059669;
      --dist-bg: rgba(245, 158, 11, 0.16);
      --dist-text: #b45309;
      --corp-a-bg: rgba(37, 99, 235, 0.1);
      --corp-a-tx: #1d4ed8;
      --corp-b-bg: rgba(147, 51, 234, 0.1);
      --corp-b-tx: #7e22ce;
      --corp-v-bg: rgba(13, 148, 136, 0.1);
      --corp-v-tx: #0f766e;
      --tg-bg: rgba(2, 132, 199, 0.1);
      --tg-border: rgba(2, 132, 199, 0.28);
      --tg-tx: #0284c7;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(40px + env(safe-area-inset-bottom, 0px));
      line-height: 1.4;
    }
    .wrap { max-width: 700px; margin: 0 auto; }

    /* Шапка */
    .header-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .school-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 3px;
    }
    h1 { font-size: 21px; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
    .meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .meta { color: var(--muted); font-size: 12.5px; }
    .creator-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--tg-bg);
      border: 1px solid var(--tg-border);
      color: var(--tg-tx);
      padding: 2.5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.12s, border-color 0.15s, filter 0.15s;
    }
    .creator-chip:hover { filter: brightness(1.1); border-color: var(--tg-tx); }
    .creator-chip:active { transform: scale(0.96); }
    .creator-chip svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }
    .creator-chip b { font-weight: 800; }

    .icon-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      background: var(--card-sub);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      height: 36px;
      padding: 0 11px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.1s;
    }
    .icon-btn:active { transform: scale(0.97); }
    .icon-btn:hover { border-color: var(--accent); }
    .icon-btn.install-accent {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Переключатель учебных дней (Сегодня / Завтра) */
    .day-switcher {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }
    .day-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      transition: 0.15s;
    }
    .day-btn:hover { border-color: var(--accent); }
    .day-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .day-btn.waiting {
      opacity: 0.62;
      border-style: dashed;
    }
    .day-btn-main { display: flex; flex-direction: column; min-width: 0; }
    .day-btn-label { font-size: 13px; font-weight: 800; color: var(--text); }
    .day-btn.active .day-btn-label { color: var(--accent); }
    .day-btn-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day-new-pill {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--now-soft);
      color: var(--now-text);
      border: 1px solid var(--now-border);
      padding: 2px 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* Универсальная плашка помощи по установке PWA */
    .install-sheet {
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 12px;
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      box-shadow: var(--shadow);
    }
    .install-sheet.open { display: flex; }
    .install-sheet-body { flex: 1; line-height: 1.45; }
    .install-copy-btn {
      margin-top: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .install-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 4px;
    }

    /* Навигация по режимам */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 4px;
      margin-bottom: 12px;
      gap: 4px;
    }
    .nav-tab {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 9px 8px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .nav-tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.35);
    }

    /* Панель выбора параллели и класса */
    .selector-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .grade-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .grade-scroll::-webkit-scrollbar { display: none; }
    .grade-btn {
      background: var(--card-sub);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .grade-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 6px;
    }
    .class-btn {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 4px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: 0.12s;
    }
    .class-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 800;
    }

    /* Поиск учителя */
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-input {
      width: 100%;
      padding: 11px 36px 11px 13px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--card-sub);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 6px;
      display: none;
    }
    .teacher-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-height: 148px;
      overflow-y: auto;
    }
    .teacher-chip {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
    }
    .teacher-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    /* Переключатель дня во вкладке Звонки */
    .bells-day-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .bells-day-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 9px 10px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .bells-day-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Сводка дня / Живой таймер */
    .status-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }
    .status-banner.live {
      background: var(--now-soft);
      border-color: var(--now-border);
    }
    .status-left { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--now-border);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.22);
      flex-shrink: 0;
    }
    .status-right { color: var(--muted); font-size: 12px; white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* Заголовок секции с кнопкой Поделиться */
    .section-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 4px 2px 10px;
    }
    .section-title { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shift-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .share-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .share-btn:hover { color: var(--text); border-color: var(--accent); }

    /* Карточка урока */
    .lesson-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 13px;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: stretch;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .lesson-card.is-now {
      border-color: var(--now-border);
      box-shadow: 0 0 0 1px var(--now-border);
    }
    .time-col {
      min-width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-right: 10px;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .lesson-num {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.1;
    }
    .lesson-card.is-now .lesson-num { color: var(--now-text); }
    .time-start { font-size: 12px; font-weight: 700; color: var(--text); margin-top: 3px; }
    .time-end { font-size: 11px; color: var(--muted); }

    .lesson-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .lesson-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .subj-name { font-weight: 700; font-size: 15px; line-height: 1.3; word-break: break-word; }
    .teacher-name { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
    .now-tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--now-text);
      background: var(--now-soft);
      padding: 2px 6px;
      border-radius: 5px;
      margin-bottom: 4px;
      align-self: flex-start;
    }

    /* Бейджи кабинетов по корпусам */
    .room-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      background: var(--corp-a-bg);
      color: var(--corp-a-tx);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .room-badge.corp-b { background: var(--corp-b-bg); color: var(--corp-b-tx); }
    .room-badge.corp-v { background: var(--corp-v-bg); color: var(--corp-v-tx); }
    .room-badge.dist { background: var(--dist-bg); color: var(--dist-text); }

    /* Подгруппы */
    .subgroups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      width: 100%;
    }
    .sg-box {
      background: var(--card-sub);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
    }
    .sg-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    /* Строка большой перемены (только 20 мин) или окна */
    .break-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11.5px;
      margin: -2px 8px 6px 72px;
    }
    .break-divider::before, .break-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Таблица всех звонков */
    .bells-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
    }
    .bells-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 15px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .bells-row:last-child { border-bottom: none; }
    .bells-row.is-now { background: var(--now-soft); }
    .bells-num { font-weight: 800; color: var(--accent); min-width: 82px; }
    .bells-dur { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 4px; }
    .bells-time { font-weight: 700; font-variant-numeric: tabular-nums; }
    .bells-break { font-size: 12px; color: var(--muted); min-width: 105px; text-align: right; }
    .bells-break.big { color: var(--dist-text); font-weight: 700; }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 32px 16px;
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #10b981;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 9px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: 0.22s;
      z-index: 50;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      h1 { font-size: 19px; }
      .subgroups-grid { grid-template-columns: 1fr; }
      .break-divider { margin-left: 12px; }
      .icon-btn { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header-card">
      <div class="header-top">
        <div>
          <div class="school-tag" id="schoolName">МАОУ «Школа русской культуры»</div>
          <h1 id="title">Расписание уроков</h1>
          <div class="meta-row">
            <span class="meta" id="meta">Загрузка актуального расписания...</span>
            <a class="creator-chip" id="creatorLink" href="https://t.me/cryforsex" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.94 4.66a1.5 1.5 0 0 0-1.64-.28L2.93 11.45a1.42 1.42 0 0 0 .09 2.67l4.46 1.52 1.72 5.28a1.3 1.3 0 0 0 2.18.5l2.58-2.49 4.56 3.35a1.52 1.52 0 0 0 2.38-.93l2.44-15.17a1.5 1.5 0 0 0-1.4-1.52Zm-3.2 3.19-8.18 7.39a.75.75 0 0 0-.23.43l-.55 2.77-.98-3.02a.75.75 0 0 1 .27-.84l9.38-6.97a.25.25 0 0 1 .29.24Z"/></svg>
              <span>creator: <b>@cryforsex</b></span>
            </a>
          </div>
        </div>
        <div class="icon-actions">
          <button class="icon-btn install-accent" id="installBtn" type="button" style="display:none" title="Установить приложение">📲</button>
          <button class="icon-btn" id="themeBtn" type="button" title="Сменить тему">🌙</button>
          <a class="icon-btn" href="./latest.pdf" target="_blank" title="Открыть оригинал PDF">📄 PDF</a>
        </div>
      </div>
    </header>

    <!-- Адаптивная подсказка установки для любого браузера -->
    <div class="install-sheet" id="installSheet">
      <div class="install-sheet-body" id="installSheetBody"></div>
      <button class="install-close" id="installClose" type="button" aria-label="Закрыть">✕</button>
    </div>

    <!-- Переключатель дней (Сегодня / Завтра) -->
    <div class="day-switcher" id="daySwitcher" style="display:none"></div>

    <!-- Переключатель разделов -->
    <nav class="nav-tabs">
      <button class="nav-tab active" id="tabClass" type="button">🎒 Классы</button>
      <button class="nav-tab" id="tabTeacher" type="button">👩‍🏫 Учителя</button>
      <button class="nav-tab" id="tabBells" type="button">🔔 Звонки</button>
    </nav>

    <!-- Выбор класса -->
    <section class="selector-card" id="classPanel">
      <div class="grade-scroll" id="gradeRow"></div>
      <div class="class-grid" id="classGrid"></div>
    </section>

    <!-- Поиск учителя -->
    <section class="selector-card" id="teacherPanel" style="display:none">
      <div class="search-wrap">
        <input class="search-input" id="teacherInput" type="search" autocomplete="off" placeholder="Фамилия учителя (например: Бурый, Сенькина)..." />
        <button class="clear-btn" id="clearTeacherBtn" type="button">✕</button>

    <!-- Живой баннер времени / сводка смены -->

      <div class="status-left" id="statusLeft"></div>

    </div>

      <div class="section-title">
        <span id="sectionTitle">—</span>
        <span class="shift-pill" id="shiftPill"></span>

    </div>

    <main id="contentList"></main>
  </div>

  <div class="toast" id="toast">Скопировано в буфер обмена</div>

  <script>
    const BELLS_MONDAY = {
      1:  { start: '08:00', end: '08:30' },
      2:  { start: '08:40', end: '09:20' },
      3:  { start: '09:30', end: '10:10' },
      4:  { start: '10:30', end: '11:10' },
      5:  { start: '11:30', end: '12:10' },
      6:  { start: '12:20', end: '13:00' },
      7:  { start: '13:10', end: '13:50' },
      8:  { start: '14:00', end: '14:40' },
      9:  { start: '15:00', end: '15:40' },
      10: { start: '15:50', end: '16:30' },
      11: { start: '16:40', end: '17:20' },
      12: { start: '17:30', end: '18:10' },
      13: { start: '18:20', end: '19:00' }
    };

    const BELLS_REGULAR = {
      1:  { start: '08:00', end: '08:40' },
      2:  { start: '08:50', end: '09:30' },
      3:  { start: '09:40', end: '10:20' },
      4:  { start: '10:40', end: '11:20' },
      5:  { start: '11:40', end: '12:20' },
      6:  { start: '12:30', end: '13:10' },
      7:  { start: '13:20', end: '14:00' },
      8:  { start: '14:10', end: '14:50' },
      9:  { start: '15:10', end: '15:50' },
      10: { start: '16:00', end: '16:40' },
      11: { start: '16:50', end: '17:30' },
      12: { start: '17:40', end: '18:20' },
      13: { start: '18:30', end: '19:10' }
    };

    const SHORT_WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const isTgWebApp = Boolean(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      if (window.Telegram.WebApp.colorScheme === 'light' && !localStorage.getItem('ui_theme')) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }

    const savedTheme = localStorage.getItem('ui_theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    (function setupAppleTouchIcon() {
      const link = document.getElementById('appleTouchIcon');
      if (!link) return;
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 180;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 180, 180);
          link.href = canvas.toDataURL('image/png');
        } catch (_) {}
      };
      img.src = './icon.svg?v=3';
    })();

    if ('serviceWorker' in navigator && !isTgWebApp) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=3').catch(() => {});
      });
    }

    const els = {
      school: document.getElementById('schoolName'),
      title: document.getElementById('title'),
      meta: document.getElementById('meta'),
      metaThemeColor: document.getElementById('metaThemeColor'),
      creatorLink: document.getElementById('creatorLink'),
      installBtn: document.getElementById('installBtn'),
      installSheet: document.getElementById('installSheet'),
      installSheetBody: document.getElementById('installSheetBody'),
      installClose: document.getElementById('installClose'),
      daySwitcher: document.getElementById('daySwitcher'),
      themeBtn: document.getElementById('themeBtn'),
      tabClass: document.getElementById('tabClass'),
      tabTeacher: document.getElementById('tabTeacher'),
      tabBells: document.getElementById('tabBells'),
      classPanel: document.getElementById('classPanel'),
      teacherPanel: document.getElementById('teacherPanel'),
      gradeRow: document.getElementById('gradeRow'),
      classGrid: document.getElementById('classGrid'),
      teacherInput: document.getElementById('teacherInput'),
      clearTeacherBtn: document.getElementById('clearTeacherBtn'),
      teacherChips: document.getElementById('teacherChips'),
      statusBanner: document.getElementById('statusBanner'),
      statusLeft: document.getElementById('statusLeft'),
      statusRight: document.getElementById('statusRight'),
      sectionBar: document.getElementById('sectionBar'),
      sectionTitle: document.getElementById('sectionTitle'),
      shiftPill: document.getElementById('shiftPill'),
      shareBtn: document.getElementById('shareBtn'),
      list: document.getElementById('contentList'),
      toast: document.getElementById('toast')
    };

    let RAW_JSON = null;
    let DAYS_MAP = {};
    let DAY_KEYS = [];
    let selectedDayKey = '';
    let DATA = null;
    let ALL_TEACHERS = [];
    let mode = 'class';
    let bellsTabDay = null;
    let currentGrade = localStorage.getItem('saved_grade') || '5';
    let currentClass = localStorage.getItem('selected_class') || '5 А';
    let currentTeacher = localStorage.getItem('selected_teacher') || '';
    let deferredInstallPrompt = null;

    const ua = navigator.userAgent || '';
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIos = /iphone|ipad|ipod/i.test(ua);
    const isAndroid = /android/i.test(ua);
    const isInAppWebView = /Telegram|VKClient|Instagram|FBAN|FBAV|Line\/|wv\)/i.test(ua);
    const isDesktopFirefox = /firefox/i.test(ua) && !isAndroid && !isIos;

    if (!isStandalone && !isTgWebApp) {
      els.installBtn.style.display = 'inline-flex';
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        els.installBtn.style.display = 'inline-flex';
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        els.installBtn.style.display = 'none';
        els.installSheet.classList.remove('open');
        showToast('Приложение ШРК установлено!');
      });
    }

    function buildInstallHelpHtml() {
      if (isInAppWebView) {
        return `
          <b>⚠️ Сайт открыт во встроенном окне мессенджера</b><br>
          Встроенный браузер Telegram/VK блокирует установку приложений. Нажми <b>⋮</b> (или <b>Поделиться</b>) в углу экрана и выбери <b>«Открыть в браузере»</b> (Chrome / Safari), затем нажми <b>📲</b>.<br>
          <button type="button" class="install-copy-btn" id="copySiteUrlBtn">📋 Скопировать ссылку сайта</button>
        `;
      }
      if (isIos) {
        return `
          <b>📲 Установка на iPhone / iPad:</b><br>
          1. Открой сайт в <b>Safari</b> и нажми кнопку <b>«Поделиться» (⬆️)</b> внизу экрана.<br>
          2. Прокрути меню вниз и выбери <b>«На экран „Домой“» → «Добавить»</b>.
        `;
      }
      if (isAndroid) {
        return `
          <b>📲 Установка на Android:</b><br>
          Нажми <b>⋮</b> (три точки в правом верхнем углу браузера Chrome / Яндекс) и выбери пункт <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>.
        `;
      }
      if (isDesktopFirefox) {
        return `
          <b>💻 Установка на ПК:</b><br>
          Настольный Firefox не поддерживает установку сайтов как приложений. Открой эту ссылку в <b>Chrome, Edge или Яндекс Браузере</b> — там кнопка <b>📲</b> установит приложение в 1 клик.<br>
          <button type="button" class="install-copy-btn" id="copySiteUrlBtn">📋 Скопировать ссылку</button>
        `;
      }
      return `
        <b>📲 Как установить приложение:</b><br>
        Нажми на значок установки <b>⊕ / 📲</b> справа в адресной строке браузера или открой меню <b>⋮ → «Установить ШРК Уроки»</b>.
      `;
    }

    els.installBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice && choice.outcome === 'accepted') {
          els.installBtn.style.display = 'none';
        }
        deferredInstallPrompt = null;
        return;
      }
      els.installSheetBody.innerHTML = buildInstallHelpHtml();
      els.installSheet.classList.toggle('open');
      const copyBtn = document.getElementById('copySiteUrlBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(location.origin + location.pathname);
            showToast('Ссылка скопирована!');
          } catch (_) {}
        });
      }
    });

    els.installClose.addEventListener('click', () => {
      els.installSheet.classList.remove('open');
    });

    els.creatorLink.addEventListener('click', (e) => {
      if (isTgWebApp && typeof window.Telegram.WebApp.openTelegramLink === 'function') {
        e.preventDefault();
        window.Telegram.WebApp.openTelegramLink('https://t.me/cryforsex');
      }
    });

    function syncThemeIcon() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      els.themeBtn.textContent = isLight ? '☀️' : '🌙';
      if (els.metaThemeColor) {
        els.metaThemeColor.setAttribute('content', isLight ? '#f1f5f9' : '#090d16');
      }
    }
    syncThemeIcon();

    els.themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ui_theme', next);
      syncThemeIcon();
    });

    function parseDateKey(str) {
      const m = String(str || '').match(/(\d{1,2})[._-](\d{1,2})[._-](\d{4})/);
      if (!m) return null;
      return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    }

    function formatDdMm(dateStr) {
      const m = String(dateStr || '').match(/(\d{1,2})[._-](\d{1,2})[._-](\d{4})/);
      return m ? `${m[1].padStart(2, '0')}.${m[2].padStart(2, '0')}` : dateStr;
    }

    function getMskNow() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });
      const todayDt = new Date(Number(map.year), Number(map.month) - 1, Number(map.day));
      const tmrDt = new Date(todayDt);
      tmrDt.setDate(tmrDt.getDate() + 1);
      const pad = (n) => String(n).padStart(2, '0');
      return {
        dateStr: `${map.day}.${map.month}.${map.year}`,
        tomorrowStr: `${pad(tmrDt.getDate())}.${pad(tmrDt.getMonth() + 1)}.${tmrDt.getFullYear()}`,
        todayTs: todayDt.getTime(),
        minutes: Number(map.hour) * 60 + Number(map.minute)
      };
    }

    function pickInitialDayKey() {
      if (!DAY_KEYS.length) return '';
      const msk = getMskNow();
      const hasToday = DAY_KEYS.includes(msk.dateStr);
      // До 19:15 МСК (конец 2-й смены) по умолчанию держим открытым «Сегодня», даже если в 10:00 утра уже выложили «Завтра»!
      if (hasToday && msk.minutes < 19 * 60 + 15) {
        return msk.dateStr;
      }
      // После 19:15 МСК автоматически фокусируем будущий учебный день (Завтра / Понедельник)
      const futureKeys = DAY_KEYS.filter(k => {
        const dt = parseDateKey(k);
        return dt && dt.getTime() > msk.todayTs;
      });
      if (futureKeys.length) return futureKeys[0];
      if (hasToday) return msk.dateStr;
      return DAY_KEYS[DAY_KEYS.length - 1];
    }

    function applySelectedDay(key) {
      if (!DAYS_MAP[key]) return;
      selectedDayKey = key;
      DATA = DAYS_MAP[key];
      ALL_TEACHERS = collectTeachers(DATA.classes);
      bellsTabDay = isScheduleMonday() ? 'monday' : 'regular';

      if (DATA.meta && DATA.meta.school) {
        els.school.textContent = DATA.meta.school;
      }
      if (DATA.meta && DATA.meta.date) {
        const wd = DATA.meta.weekday ? ` (${DATA.meta.weekday})` : '';
        els.title.textContent = `На ${DATA.meta.date}${wd}`;
      }
      const netTag = navigator.onLine === false ? ' (офлайн-кеш)' : '';
      const updTime = (RAW_JSON && RAW_JSON.updated_at) || DATA.updated_at || '—';
      els.meta.textContent = `Обновлено из MAX: ${updTime}${netTag}`;

      renderDaySwitcher();
      renderCurrentView();
    }

    function renderDaySwitcher() {
      if (!DAY_KEYS.length) {
        els.daySwitcher.style.display = 'none';
        return;
      }
      els.daySwitcher.style.display = 'grid';
      const msk = getMskNow();

      const buttonsHtml = DAY_KEYS.map(key => {
        const entry = DAYS_MAP[key];
        const dt = parseDateKey(key);
        const wdShort = dt ? SHORT_WD[dt.getDay()] : ((entry.meta && entry.meta.weekday) || '');
        let relLabel = `${formatDdMm(key)} (${wdShort})`;
        let subText = (entry.meta && entry.meta.weekday) ? `${key}, ${entry.meta.weekday}` : key;
        let isFutureNew = false;

        if (key === msk.dateStr) {
          relLabel = '📅 Сегодня';
          subText = `${formatDdMm(key)} (${wdShort})`;
        } else if (key === msk.tomorrowStr) {
          relLabel = '⚡ Завтра';
          subText = `${formatDdMm(key)} (${wdShort})`;
          isFutureNew = true;
        } else if (dt && dt.getTime() > msk.todayTs) {
          relLabel = `⚡ На ${wdShort}`;
          subText = key;
          isFutureNew = true;
        }

        const activeCls = key === selectedDayKey ? 'active' : '';
        return `
          <button type="button" class="day-btn ${activeCls}" data-daykey="${escapeHtml(key)}">
            <div class="day-btn-main">
              <span class="day-btn-label">${escapeHtml(relLabel)}</span>
              <span class="day-btn-sub">${escapeHtml(subText)}</span>
            </div>
            ${isFutureNew ? '<span class="day-new-pill">Новое</span>' : ''}
          </button>
        `;
      });

      // Если пока загружен только сегодняшний день — показываем статус ожидания завтрашнего PDF
      if (DAY_KEYS.length === 1 && DAY_KEYS[0] === msk.dateStr) {
        buttonsHtml.push(`
          <button type="button" class="day-btn waiting" data-waiting="1">
            <div class="day-btn-main">
              <span class="day-btn-label">⏳ Завтра</span>
              <span class="day-btn-sub">ждём PDF в MAX</span>
            </div>
          </button>
        `);
      }

      els.daySwitcher.innerHTML = buttonsHtml.join('');
    }

    els.daySwitcher.addEventListener('click', (e) => {
      const waitBtn = e.target.closest('[data-waiting]');
      if (waitBtn) {
        showToast('Расписание на завтра появится сразу после публикации в MAX');
        return;
      }
      const btn = e.target.closest('[data-daykey]');
      if (!btn) return;
      applySelectedDay(btn.getAttribute('data-daykey'));
    });

    function isScheduleMonday() {
      if (!DATA) return false;
      const wd = ((DATA.meta && DATA.meta.weekday) || '').toLowerCase();
      if (wd.includes('понедельник')) return true;
      if (wd && !wd.includes('понедельник')) return false;
      const dateRaw = (DATA.meta && DATA.meta.date) || DATA.source_file || '';
      const dt = parseDateKey(dateRaw);
      return dt ? dt.getDay() === 1 : false;
    }

    function getActiveBells() {
      return isScheduleMonday() ? BELLS_MONDAY : BELLS_REGULAR;
    }

    function toMin(hhmm) {
      if (!hhmm) return -1;
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function getBreakMinutes(bellsMap, numA, numB) {
      if (numB !== numA + 1 || !bellsMap[numA] || !bellsMap[numB]) return 0;
      return Math.max(0, toMin(bellsMap[numB].start) - toMin(bellsMap[numA].end));
    }

    function isScheduleToday() {
      if (!DATA || !DATA.meta || !DATA.meta.date) return false;
      return DATA.meta.date.trim() === getMskNow().dateStr;
    }

    function getActiveLessonNum(bellsMap) {
      if (!isScheduleToday()) return null;
      const cur = getMskNow().minutes;
      for (const [numStr, b] of Object.entries(bellsMap)) {
        if (cur >= toMin(b.start) && cur < toMin(b.end)) {
          return Number(numStr);
        }
      }
      return null;
    }

    function normStr(s) {
      return (s || '').toLowerCase().replace(/ё/g, 'е').trim();
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function badgeHtml(room) {
      if (!room) return '';
      const r = room.trim();
      const up = r.toUpperCase();
      if (up === 'ДИСТ') {
        return `<span class="room-badge dist">💻 ДИСТ</span>`;
      }
      let extra = '';
      if (up.startsWith('Б.') || up.startsWith('B.')) extra = 'corp-b';
      else if (up.startsWith('В.')) extra = 'corp-v';
      return `<span class="room-badge ${extra}">каб. ${escapeHtml(r)}</span>`;
    }

    function getGrade(clsName) {
      const m = String(clsName).match(/^(\d+)/);
      return m ? m[1] : '';
    }

    function collectTeachers(classesObj) {
      const set = new Set();
      Object.values(classesObj || {}).forEach(lessons => {
        (lessons || []).forEach(l => {
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              if (sg.teacher && sg.teacher.trim()) set.add(sg.teacher.trim());
            });
          } else if (l.teacher && l.teacher.trim()) {
            set.add(l.teacher.trim());
          }
        });
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'ru'));
    }

    function timeColHtml(bellsMap, num) {
      const b = bellsMap[num];
      return `
        <div class="time-col">
          <div class="lesson-num">${escapeHtml(num)} ур.</div>
          ${b ? `<div class="time-start">${b.start}</div><div class="time-end">${b.end}</div>` : ''}
        </div>
      `;
    }

    function renderStatusForLessons(lessons) {
      if (!lessons || !lessons.length) {
        els.statusBanner.style.display = 'none';
        return;
      }
      const bellsMap = getActiveBells();
      const nums = lessons.map(l => Number(l.lesson || l.num || 0)).filter(n => n > 0);
      if (!nums.length) {
        els.statusBanner.style.display = 'none';
        return;
      }
      const firstNum = Math.min(...nums);
      const lastNum = Math.max(...nums);
      const startSpan = bellsMap[firstNum] ? bellsMap[firstNum].start : '';
      const endSpan = bellsMap[lastNum] ? bellsMap[lastNum].end : '';
      const timeRangeText = (startSpan && endSpan) ? `${startSpan}–${endSpan}` : `${firstNum}–${lastNum} ур.`;

      els.statusBanner.style.display = 'flex';
      if (!isScheduleToday()) {
        els.statusBanner.classList.remove('live');
        const dateTitle = (DATA.meta && DATA.meta.date) ? DATA.meta.date : '';
        const wd = (DATA.meta && DATA.meta.weekday) ? `${DATA.meta.weekday}, ` : '';
        const monNote = isScheduleMonday() ? ' • звонки Пн' : '';
        els.statusLeft.innerHTML = `<span>🗓️ На ${escapeHtml(wd + dateTitle)}${monNote}</span>`;
        els.statusRight.textContent = `🕗 ${timeRangeText} (${lessons.length} ур.)`;
        return;
      }

      const cur = getMskNow().minutes;
      const firstStart = bellsMap[firstNum] ? toMin(bellsMap[firstNum].start) : -1;
      const lastEnd = bellsMap[lastNum] ? toMin(bellsMap[lastNum].end) : -1;

      if (firstStart > 0 && cur < firstStart) {
        const diff = firstStart - cur;
        els.statusBanner.classList.toggle('live', diff <= 60);
        els.statusLeft.innerHTML = diff <= 60
          ? `<span class="pulse-dot"></span><span>До начала ${firstNum}-го урока: ${diff} мин</span>`
          : `<span>Начало занятий в ${bellsMap[firstNum].start}</span>`;
        els.statusRight.textContent = timeRangeText;
        return;
      }

      if (lastEnd > 0 && cur >= lastEnd) {
        els.statusBanner.classList.remove('live');
        els.statusLeft.innerHTML = `<span>✅ Уроки на сегодня завершены</span>`;
        els.statusRight.textContent = timeRangeText;
        return;
      }

      for (let i = 0; i < nums.length; i++) {
        const n = nums[i];
        const b = bellsMap[n];
        if (!b) continue;
        const s = toMin(b.start), e = toMin(b.end);
        if (cur >= s && cur < e) {
          els.statusBanner.classList.add('live');
          els.statusLeft.innerHTML = `<span class="pulse-dot"></span><span>Идёт ${n}-й урок • до звонка ${e - cur} мин</span>`;
          els.statusRight.textContent = `до ${b.end}`;
          return;
        }
        if (i + 1 < nums.length) {
          const nextN = nums[i + 1];
          const nextB = bellsMap[nextN];
          if (nextB && cur >= e && cur < toMin(nextB.start)) {
            els.statusBanner.classList.add('live');
            els.statusLeft.innerHTML = `<span class="pulse-dot"></span><span>Перемена • до ${nextN}-го урока ${toMin(nextB.start) - cur} мин</span>`;
            els.statusRight.textContent = `в ${nextB.start}`;
            return;
          }
        }
      }

      els.statusBanner.classList.remove('live');
      els.statusLeft.innerHTML = `<span>Расписание на сегодня</span>`;
      els.statusRight.textContent = timeRangeText;
    }

    function setMode(nextMode) {
      mode = nextMode;
      els.classPanel.style.display = mode === 'class' ? 'block' : 'none';
      els.teacherPanel.style.display = mode === 'teacher' ? 'block' : 'none';
      els.sectionBar.style.display = mode === 'bells' ? 'none' : 'flex';
      els.tabClass.classList.toggle('active', mode === 'class');
      els.tabTeacher.classList.toggle('active', mode === 'teacher');
      els.tabBells.classList.toggle('active', mode === 'bells');
      renderCurrentView();
    }

    function renderCurrentView() {
      if (mode === 'class') renderClassUI();
      else if (mode === 'teacher') renderTeacherUI();
      else renderBellsUI();
    }

    function renderClassUI() {
      if (!DATA || !DATA.classes) return;
      const allClasses = Object.keys(DATA.classes);
      if (!allClasses.length) {
        els.list.innerHTML = '<div class="empty-state">Расписание пока пустое</div>';
        return;
      }

      if (!DATA.classes[currentClass]) currentClass = allClasses[0];
      currentGrade = getGrade(currentClass) || currentGrade;
      localStorage.setItem('selected_class', currentClass);
      localStorage.setItem('saved_grade', currentGrade);

      const grades = Array.from(new Set(allClasses.map(getGrade).filter(Boolean)))
        .sort((a, b) => Number(a) - Number(b));

      els.gradeRow.innerHTML = grades.map(g =>
        `<button type="button" class="grade-btn ${g === currentGrade ? 'active' : ''}" data-grade="${escapeHtml(g)}">${escapeHtml(g)} параллель</button>`
      ).join('');

      const gradeClasses = allClasses.filter(c => getGrade(c) === currentGrade);
      els.classGrid.innerHTML = gradeClasses.map(c =>
        `<button type="button" class="class-btn ${c === currentClass ? 'active' : ''}" data-class="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join('');

      const lessons = DATA.classes[currentClass] || [];
      const firstNum = lessons.length ? Number(lessons[0].lesson || lessons[0].num || 1) : 1;
      els.sectionTitle.textContent = `Класс ${currentClass}`;
      els.shiftPill.textContent = !lessons.length ? '0 ур.' : (firstNum >= 5 ? `2 смена • ${lessons.length} ур.` : `1 смена • ${lessons.length} ур.`);

      renderStatusForLessons(lessons);

      if (!lessons.length) {
        els.list.innerHTML = '<div class="empty-state">Уроков для выбранного класса не найдено</div>';
        return;
      }

      const bellsMap = getActiveBells();
      const activeNum = getActiveLessonNum(bellsMap);
      const blocks = [];

      lessons.forEach((l, idx) => {
        const num = Number(l.lesson || l.num || (idx + 1));
        const isNow = activeNum === num;
        const nowBadge = isNow ? '<div class="now-tag">● Сейчас идёт</div>' : '';

        if (idx > 0) {
          const prevNum = Number(lessons[idx - 1].lesson || lessons[idx - 1].num || idx);
          if (num > prevNum + 1) {
            blocks.push(`<div class="break-divider">⏸ Окно (${prevNum + 1} урок свободен)</div>`);
          } else {
            const brk = getBreakMinutes(bellsMap, prevNum, num);
            if (brk >= 20) {
              blocks.push(`<div class="break-divider">☕ Большая перемена ${brk} мин</div>`);
            }
          }
        }

        if (Array.isArray(l.subgroups) && l.subgroups.length) {
          blocks.push(`
            <div class="lesson-card ${isNow ? 'is-now' : ''}">
              ${timeColHtml(bellsMap, num)}
              <div class="lesson-content">
                ${nowBadge}
                <div class="subgroups-grid">
                  ${l.subgroups.map(sg => `
                    <div class="sg-box">
                      <div class="sg-top"><span>${escapeHtml(sg.group)} подгруппа</span>${badgeHtml(sg.room)}</div>
                      <div class="subj-name">${escapeHtml(sg.subject || 'Урок')}</div>
                      <div class="teacher-name">${escapeHtml(sg.teacher || '')}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `);
        } else {
          blocks.push(`
            <div class="lesson-card ${isNow ? 'is-now' : ''}">
              ${timeColHtml(bellsMap, num)}
              <div class="lesson-content">
                ${nowBadge}
                <div class="lesson-main">
                  <div class="subj-name">${escapeHtml(l.subject || l.text || '')}</div>
                  ${badgeHtml(l.room)}
                </div>
                ${l.teacher ? `<div class="teacher-name">${escapeHtml(l.teacher)}</div>` : ''}
              </div>
            </div>
          `);
        }
      });

      els.list.innerHTML = blocks.join('');
    }

    function renderTeacherUI() {
      if (!DATA || !DATA.classes) return;
      const rawQuery = els.teacherInput.value;
      els.clearTeacherBtn.style.display = rawQuery ? 'block' : 'none';
      const query = normStr(rawQuery);
      const filteredTeachers = ALL_TEACHERS.filter(t => !query || normStr(t).includes(query));

      if ((!currentTeacher || !filteredTeachers.includes(currentTeacher)) && filteredTeachers.length) {
        currentTeacher = filteredTeachers[0];
      }

      els.teacherChips.innerHTML = filteredTeachers.map(t =>
        `<button type="button" class="teacher-chip ${t === currentTeacher ? 'active' : ''}" data-teacher="${escapeHtml(t)}">${escapeHtml(t)}</button>`
      ).join('');

      const targetExact = filteredTeachers.includes(currentTeacher) ? currentTeacher : '';
      els.sectionTitle.textContent = targetExact || (rawQuery.trim() ? `Поиск: ${rawQuery.trim()}` : 'Выберите учителя');

      const hits = [];
      Object.entries(DATA.classes).forEach(([cls, lessons]) => {
        (lessons || []).forEach(l => {
          const num = Number(l.lesson || l.num || 0);
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              const tName = (sg.teacher || '').trim();
              const matched = targetExact ? (tName === targetExact) : (query && normStr(tName).includes(query));
              if (matched) {
                hits.push({ lesson: num, num, cls: `${cls} (${sg.group} гр.)`, subject: sg.subject, room: sg.room, teacher: tName });
              }
            });
          } else {
            const tName = (l.teacher || '').trim();
            const matched = targetExact
              ? (tName === targetExact)
              : (query && (normStr(tName).includes(query) || normStr(l.text).includes(query)));
            if (matched) {
              hits.push({ lesson: num, num, cls, subject: l.subject || l.text, room: l.room, teacher: tName });
            }
          }
        });
      });

      hits.sort((a, b) => a.num - b.num || a.cls.localeCompare(b.cls, 'ru'));
      els.shiftPill.textContent = `${hits.length} ур.`;
      renderStatusForLessons(hits);

      if (!hits.length) {
        els.list.innerHTML = '<div class="empty-state">Уроков для этого учителя не найдено</div>';
        return;
      }

      const bellsMap = getActiveBells();
      const activeNum = getActiveLessonNum(bellsMap);
      const blocks = [];
      hits.forEach((h, idx) => {
        const isNow = activeNum === h.num;
        if (idx > 0) {
          const prevNum = hits[idx - 1].num;
          if (h.num > prevNum + 1) {
            const gapCount = h.num - prevNum - 1;
            blocks.push(`<div class="break-divider">⏸ Окно между уроками (${gapCount} ур.)</div>`);
          } else {
            const brk = getBreakMinutes(bellsMap, prevNum, h.num);
            if (brk >= 20) {
              blocks.push(`<div class="break-divider">☕ Большая перемена ${brk} мин</div>`);
            }
          }
        }
        blocks.push(`
          <div class="lesson-card ${isNow ? 'is-now' : ''}">
            ${timeColHtml(bellsMap, h.num)}
            <div class="lesson-content">
              ${isNow ? '<div class="now-tag">● Сейчас идёт</div>' : ''}
              <div class="lesson-main">
                <div class="subj-name">${escapeHtml(h.cls)} — ${escapeHtml(h.subject || '')}</div>
                ${badgeHtml(h.room)}
              </div>
              <div class="teacher-name">${escapeHtml(h.teacher || '')}</div>
            </div>
          </div>
        `);
      });

      els.list.innerHTML = blocks.join('');
    }

    function renderBellsUI() {
      els.statusBanner.style.display = 'none';
      if (!bellsTabDay) {
        bellsTabDay = isScheduleMonday() ? 'monday' : 'regular';
      }
      const chosenMap = bellsTabDay === 'monday' ? BELLS_MONDAY : BELLS_REGULAR;
      const activeNum = ((bellsTabDay === 'monday') === isScheduleMonday()) ? getActiveLessonNum(chosenMap) : null;

      const switchHtml = `
        <div class="bells-day-switch">
          <button type="button" class="bells-day-btn ${bellsTabDay === 'monday' ? 'active' : ''}" data-bday="monday">Понедельник (1 ур. — 30 мин)</button>
          <button type="button" class="bells-day-btn ${bellsTabDay === 'regular' ? 'active' : ''}" data-bday="regular">Вт – Пт (все по 40 мин)</button>
        </div>
      `;

      const rows = Object.entries(chosenMap).map(([numStr, b]) => {
        const n = Number(numStr);
        const dur = toMin(b.end) - toMin(b.start);
        const brk = getBreakMinutes(chosenMap, n, n + 1);
        const isBig = brk >= 20;
        const brkLabel = brk > 0 ? (isBig ? `☕ перемена ${brk} мин` : `перемена ${brk} мин`) : 'конец занятий';
        return `
          <div class="bells-row ${activeNum === n ? 'is-now' : ''}">
            <div class="bells-num">${n} урок <span class="bells-dur">${dur}м</span></div>
            <div class="bells-time">${b.start} – ${b.end}</div>
            <div class="bells-break ${isBig ? 'big' : ''}">${brkLabel}</div>
          </div>
        `;
      }).join('');

      els.list.innerHTML = `${switchHtml}<div class="bells-card">${rows}</div>`;
    }

    function buildShareText() {
      if (!DATA || !DATA.classes) return '';
      const bellsMap = getActiveBells();
      const dateStr = (DATA.meta && DATA.meta.date) ? DATA.meta.date : '';
      const wd = (DATA.meta && DATA.meta.weekday) ? ` (${DATA.meta.weekday})` : '';
      if (mode === 'class') {
        const lessons = DATA.classes[currentClass] || [];
        const lines = [`📅 Расписание ${currentClass} на ${dateStr}${wd}:`];
        lessons.forEach(l => {
          const n = l.lesson || l.num;
          const t = bellsMap[n] ? ` (${bellsMap[n].start}–${bellsMap[n].end})` : '';
          if (Array.isArray(l.subgroups)) {
            lines.push(`${n} ур.${t}:`);
            l.subgroups.forEach(sg => {
              lines.push(`  • ${sg.group} гр: ${sg.subject} [${sg.room}]`);
            });
          } else {
            lines.push(`${n} ур.${t}: ${l.subject || l.text} [${l.room || '—'}]`);
          }
        });
        lines.push(`\n🌐 ${location.origin}${location.pathname}`);
        return lines.join('\n');
      }
      return `${els.sectionTitle.textContent} — ${location.href}`;
    }

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add('show');
      setTimeout(() => els.toast.classList.remove('show'), 2200);
    }

    els.shareBtn.addEventListener('click', async () => {
      const text = buildShareText();
      if (navigator.share) {
        try {
          await navigator.share({ title: els.title.textContent, text });
          return;
        } catch (_) {}
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast('Расписание скопировано!');
      } catch (_) {
        showToast('Не удалось скопировать');
      }
    });

    els.tabClass.addEventListener('click', () => setMode('class'));
    els.tabTeacher.addEventListener('click', () => setMode('teacher'));
    els.tabBells.addEventListener('click', () => setMode('bells'));

    els.list.addEventListener('click', (e) => {
      const bBtn = e.target.closest('[data-bday]');
      if (!bBtn) return;
      bellsTabDay = bBtn.getAttribute('data-bday');
      renderBellsUI();
    });

    els.gradeRow.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-grade]');
      if (!btn || !DATA) return;
      currentGrade = btn.getAttribute('data-grade');
      const matching = Object.keys(DATA.classes).filter(c => getGrade(c) === currentGrade);
      if (matching.length && !matching.includes(currentClass)) {
        currentClass = matching[0];
      }
      renderClassUI();
    });

    els.classGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-class]');
      if (!btn) return;
      currentClass = btn.getAttribute('data-class');
      renderClassUI();
    });

    els.teacherChips.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-teacher]');
      if (!btn) return;
      currentTeacher = btn.getAttribute('data-teacher');
      localStorage.setItem('selected_teacher', currentTeacher);
      renderTeacherUI();
    });

    els.teacherInput.addEventListener('input', () => {
      currentTeacher = '';
      renderTeacherUI();
    });

    els.clearTeacherBtn.addEventListener('click', () => {
      els.teacherInput.value = '';
      currentTeacher = '';
      renderTeacherUI();
      els.teacherInput.focus();
    });

    setInterval(() => {
      if (DATA) {
        renderDaySwitcher();
        renderCurrentView();
      }
    }, 30000);

    fetch('./schedule.json?t=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(json => {
        RAW_JSON = json;
        DAYS_MAP = {};
        if (json.days && typeof json.days === 'object' && Object.keys(json.days).length) {
          Object.entries(json.days).forEach(([k, v]) => {
            if (v && v.classes) DAYS_MAP[k] = v;
          });
        } else if (json.classes) {
          const singleKey = (json.meta && json.meta.date) || 'current';
          DAYS_MAP[singleKey] = json;
        }

        DAY_KEYS = Object.keys(DAYS_MAP).sort((a, b) => {
          const da = parseDateKey(a), db = parseDateKey(b);
          return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
        });

        const initialKey = pickInitialDayKey();
        if (initialKey) {
          applySelectedDay(initialKey);
        }
      })
      .catch(err => {
        els.meta.textContent = 'Ошибка загрузки расписания: ' + err.message;
      });
  </script>
</body>
</html>
