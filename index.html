<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="metaThemeColor" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ШРК Уроки">
  <title>Расписание — ШРК</title>
  <link rel="manifest" id="manifestLink" href="./manifest.json?v=3">
  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=3">
  <link rel="shortcut icon" href="./icon.svg?v=3">
  <link rel="apple-touch-icon" sizes="180x180" id="appleTouchIcon" href="./icon.svg?v=3">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0f19;
      --surface: #131926;
      --surface-2: #1a2234;
      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.26);
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --now: #10b981;
      --now-soft: rgba(16, 185, 129, 0.13);
      --now-tx: #34d399;
      --corp-a-bg: rgba(59, 130, 246, 0.14);
      --corp-a-tx: #93c5fd;
      --corp-b-bg: rgba(168, 85, 247, 0.14);
      --corp-b-tx: #d8b4fe;
      --corp-v-bg: rgba(20, 184, 166, 0.14);
      --corp-v-tx: #5eead4;
      --dist-bg: rgba(245, 158, 11, 0.16);
      --dist-tx: #fbbf24;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --border: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.16);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
      --now: #059669;
      --now-soft: rgba(5, 150, 105, 0.09);
      --now-tx: #059669;
      --corp-a-bg: rgba(37, 99, 235, 0.09);
      --corp-a-tx: #1d4ed8;
      --corp-b-bg: rgba(147, 51, 234, 0.09);
      --corp-b-tx: #7e22ce;
      --corp-v-bg: rgba(13, 148, 136, 0.09);
      --corp-v-tx: #0f766e;
      --dist-bg: rgba(245, 158, 11, 0.14);
      --dist-tx: #b45309;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px calc(36px + env(safe-area-inset-bottom, 0px));
      line-height: 1.38;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 640px; margin: 0 auto; }

    /* Лаконичная верхняя шапка */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 4px 2px 12px;
    }
    .title-block { min-width: 0; }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }
    .dot-sep { opacity: 0.45; }
    .creator-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s;
    }
    .creator-link:hover, .creator-link:active { color: var(--accent); }
    .creator-link svg { width: 12px; height: 12px; fill: #38bdf8; flex-shrink: 0; }

    .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .top-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      height: 34px;
      min-width: 34px;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.1s;
    }
    .top-btn:active { transform: scale(0.96); }
    .top-btn.accent {
      background: var(--accent-soft);
      border-color: rgba(59, 130, 246, 0.35);
      color: var(--accent);
    }

    /* Подсказка установки PWA */
    .install-sheet {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }
    .install-sheet.open { display: flex; }
    .install-sheet-body { flex: 1; line-height: 1.45; }
    .install-copy-btn {
      margin-top: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .install-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }

    /* Переключатель дней — виден ТОЛЬКО когда реально доступно 2+ дня */
    .day-pills {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .day-pill {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.15s;
    }
    .day-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .new-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--now);
    }

    /* Сегментированные вкладки режимов */
    .seg-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 10px;
    }
    .seg-tab {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 7px 6px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .seg-tab.active {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
    }

    /* Компактная панель управления классом и подгруппой */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .picker-trigger {
      background: var(--accent);
      color: #fff;
      border: none;
      height: 36px;
      padding: 0 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: transform 0.1s, opacity 0.15s;
    }
    .picker-trigger:active { transform: scale(0.97); }
    .picker-chevron {
      font-size: 11px;
      opacity: 0.85;
      transition: transform 0.18s;
    }
    .picker-trigger.open .picker-chevron { transform: rotate(180deg); }

    .summary-text {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Мини-фильтр подгруппы */
    .sg-filter {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
    }
    .sg-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 7px;
      cursor: pointer;
    }
    .sg-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .share-icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, border-color 0.15s;
    }
    .share-icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
    .share-icon-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Выпадающая панель выбора параллели и класса */
    .drawer {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
      display: none;
    }
    .drawer.open { display: block; }
    .grade-bar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .grade-chip {
      background: var(--surface-2);
      border: 1px solid transparent;
      color: var(--muted);
      height: 34px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .grade-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 6px;
    }
    .class-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      height: 36px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .class-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Поиск учителя */
    .teacher-box {
      margin-bottom: 10px;
    }
    .search-wrap { position: relative; margin-bottom: 8px; }
    .search-input {
      width: 100%;
      height: 40px;
      padding: 0 36px 0 13px;
      border-radius: 11px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 14.5px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      display: none;
    }
    .teacher-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .teacher-scroll::-webkit-scrollbar { display: none; }
    .teacher-chip {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .teacher-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Живой статус — показывается ТОЛЬКО во время учебного дня */
    .live-bar {
      background: var(--now-soft);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--now-tx);
      border-radius: 11px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .live-left { display: flex; align-items: center; gap: 8px; }
    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--now);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.22);
      flex-shrink: 0;
    }

    /* Список уроков */
    .lessons-stack { display: flex; flex-direction: column; gap: 6px; }

    .lesson-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 13px;
      display: flex;
      gap: 12px;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s, border-color 0.15s;
    }
    .lesson-card.is-past { opacity: 0.52; }
    .lesson-card.is-now {
      border-color: var(--now);
      background: linear-gradient(90deg, var(--now-soft), var(--surface) 65%);
    }
    .lesson-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2.5px;
      background: var(--now);
      transition: width 0.3s;
    }

    .num-col {
      width: 46px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-right: 10px;
      border-right: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .num-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .lesson-card.is-now .num-val { color: var(--now-tx); }
    .t-start { font-size: 11.5px; font-weight: 700; color: var(--muted); margin-top: 4px; line-height: 1.1; }
    .t-end { font-size: 10.5px; color: var(--muted); opacity: 0.72; line-height: 1.1; }

    .body-col { flex: 1; min-width: 0; }
    .row-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .subj {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.28;
      word-break: break-word;
    }
    .sg-inline-tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 5px;
      border-radius: 5px;
      margin-left: 5px;
      vertical-align: middle;
    }
    .teacher-btn {
      background: none;
      border: none;
      padding: 0;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      display: inline-block;
    }
    .teacher-btn:hover { color: var(--accent); text-decoration: underline; }

    /* Бейдж кабинета без лишнего слова "каб." */
    .room {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 7px;
      background: var(--corp-a-bg);
      color: var(--corp-a-tx);
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .room.corp-b { background: var(--corp-b-bg); color: var(--corp-b-tx); }
    .room.corp-v { background: var(--corp-v-bg); color: var(--corp-v-tx); }
    .room.dist { background: var(--dist-bg); color: var(--dist-tx); }

    /* Компактное отображение 2 подгрупп (когда выбран режим "Все") */
    .sg-split {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }
    .sg-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding-top: 7px;
      border-top: 1px dashed var(--border);
    }
    .sg-row:first-child { padding-top: 0; border-top: none; }
    .sg-num-pill {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--muted);
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 5px;
    }

    /* Тонкий делитель только для большой перемены (20м) и окон */
    .divider-note {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      padding: 1px 8px 1px 58px;
      opacity: 0.85;
    }
    .divider-note::before, .divider-note::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Звонки */
    .bells-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .bells-switch-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .bells-switch-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .bells-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
    }
    .bells-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
    }
    .bells-row:last-child { border-bottom: none; }
    .bells-row.is-now { background: var(--now-soft); }
    .bells-num { font-weight: 700; color: var(--text); min-width: 70px; }
    .bells-row.is-now .bells-num { color: var(--now-tx); }
    .bells-time { font-weight: 700; }
    .bells-brk { font-size: 12px; color: var(--muted); min-width: 88px; text-align: right; }
    .bells-brk.big { color: var(--dist-tx); font-weight: 600; }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 28px 16px;
      background: var(--surface);
      border-radius: 13px;
      border: 1px solid var(--border);
      font-size: 13.5px;
    }

    .toast {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-strong);
      font-weight: 600;
      font-size: 12.5px;
      padding: 8px 15px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 420px) {
      h1 { font-size: 18px; }
      .divider-note { padding-left: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="title-block">
        <h1 id="title">Расписание</h1>
        <div class="sub-meta">
          <span id="meta">Загрузка...</span>
          <span class="dot-sep">·</span>
          <a class="creator-link" id="creatorLink" href="https://t.me/cryforsex" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.94 4.66a1.5 1.5 0 0 0-1.64-.28L2.93 11.45a1.42 1.42 0 0 0 .09 2.67l4.46 1.52 1.72 5.28a1.3 1.3 0 0 0 2.18.5l2.58-2.49 4.56 3.35a1.52 1.52 0 0 0 2.38-.93l2.44-15.17a1.5 1.5 0 0 0-1.4-1.52Zm-3.2 3.19-8.18 7.39a.75.75 0 0 0-.23.43l-.55 2.77-.98-3.02a.75.75 0 0 1 .27-.84l9.38-6.97a.25.25 0 0 1 .29.24Z"/></svg>
            <span>@cryforsex</span>
          </a>
        </div>
      </div>
      <div class="top-actions">
        <button class="top-btn accent" id="installBtn" type="button" style="display:none" title="Установить приложение">📲</button>
        <a class="top-btn" href="./latest.pdf" target="_blank" title="Оригинал PDF">PDF</a>
        <button class="top-btn" id="themeBtn" type="button" title="Сменить тему">🌙</button>
      </div>
    </header>

    <div class="install-sheet" id="installSheet">
      <div class="install-sheet-body" id="installSheetBody"></div>
      <button class="install-close" id="installClose" type="button" aria-label="Закрыть">✕</button>

    <!-- Показывается только когда реально загружено 2+ дня -->

    <nav class="seg-tabs">
      <button class="seg-tab active" id="tabClass" type="button">Уроки</button>
      <button class="seg-tab" id="tabTeacher" type="button">Учителя</button>
      <button class="seg-tab" id="tabBells" type="button">Звонки</button>
    </nav>

    <!-- Компактная панель класса (в режиме Уроки) -->
    <div id="classControls">
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="picker-trigger" id="pickerTrigger" type="button">
            <span id="currentClassLabel">5 А</span>
            <span class="picker-chevron">▼</span>
          </button>
          <span class="summary-text" id="classSummary"></span>
        </div>
        <div class="toolbar-right">
          <div class="sg-filter" id="sgFilter" style="display:none">
            <button class="sg-btn active" type="button" data-sg="all">Все</button>
            <button class="sg-btn" type="button" data-sg="1">1 гр</button>
            <button class="sg-btn" type="button" data-sg="2">2 гр</button>
          </div>
          <button class="share-icon-btn" id="shareBtn" type="button" title="Поделиться расписанием">
            <svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          </button>

    <!-- Поиск учителя (в режиме Учителя) -->
    <div class="teacher-box" id="teacherPanel" style="display:none">
      <div class="search-wrap">
        <input class="search-input" id="teacherInput" type="search" autocomplete="off" placeholder="Поиск по фамилии учителя..." />
        <button class="clear-btn" id="clearTeacherBtn" type="button">✕</button>
      </div>
      <div class="teacher-scroll" id="teacherChips"></div>
    </div>

    <!-- Живой таймер текущего урока / перемены -->
    <div class="live-bar" id="liveBar">
      <div class="live-left" id="liveLeft"></div>
      <div id="liveRight"></div>
    </div>

    <main id="contentList"></main>
  </div>

  <div class="toast" id="toast">Скопировано</div>

  <script>
    const BELLS_MONDAY = {
      1:  { start: '08:00', end: '08:30' },
      2:  { start: '08:40', end: '09:20' },
      3:  { start: '09:30', end: '10:10' },
      4:  { start: '10:30', end: '11:10' },
      5:  { start: '11:30', end: '12:10' },
      6:  { start: '12:20', end: '13:00' },
      7:  { start: '13:10', end: '13:50' },
      8:  { start: '14:00', end: '14:40' },
      9:  { start: '15:00', end: '15:40' },
      10: { start: '15:50', end: '16:30' },
      11: { start: '16:40', end: '17:20' },
      12: { start: '17:30', end: '18:10' },
      13: { start: '18:20', end: '19:00' }
    };

    const BELLS_REGULAR = {
      1:  { start: '08:00', end: '08:40' },
      2:  { start: '08:50', end: '09:30' },
      3:  { start: '09:40', end: '10:20' },
      4:  { start: '10:40', end: '11:20' },
      5:  { start: '11:40', end: '12:20' },
      6:  { start: '12:30', end: '13:10' },
      7:  { start: '13:20', end: '14:00' },
      8:  { start: '14:10', end: '14:50' },
      9:  { start: '15:10', end: '15:50' },
      10: { start: '16:00', end: '16:40' },
      11: { start: '16:50', end: '17:30' },
      12: { start: '17:40', end: '18:20' },
      13: { start: '18:30', end: '19:10' }
    };

    const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    const FULL_WD = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    const SHORT_WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

    const isTgWebApp = Boolean(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      if (window.Telegram.WebApp.colorScheme === 'light' && !localStorage.getItem('ui_theme')) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }

    const savedTheme = localStorage.getItem('ui_theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    (function setupAppleTouchIcon() {
      const link = document.getElementById('appleTouchIcon');
      if (!link) return;
      const img = new Image();
      img.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 180;
          canvas.height = 180;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 180, 180);
          link.href = canvas.toDataURL('image/png');
        } catch (_) {}
      };
      img.src = './icon.svg?v=3';
    })();

    if ('serviceWorker' in navigator && !isTgWebApp) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=4').catch(() => {});
      });
    }

    const els = {
      title: document.getElementById('title'),
      meta: document.getElementById('meta'),
      metaThemeColor: document.getElementById('metaThemeColor'),
      creatorLink: document.getElementById('creatorLink'),
      installBtn: document.getElementById('installBtn'),
      installSheet: document.getElementById('installSheet'),
      installSheetBody: document.getElementById('installSheetBody'),
      installClose: document.getElementById('installClose'),
      daySwitcher: document.getElementById('daySwitcher'),
      themeBtn: document.getElementById('themeBtn'),
      tabClass: document.getElementById('tabClass'),
      tabTeacher: document.getElementById('tabTeacher'),
      tabBells: document.getElementById('tabBells'),
      classControls: document.getElementById('classControls'),
      pickerTrigger: document.getElementById('pickerTrigger'),
      currentClassLabel: document.getElementById('currentClassLabel'),
      classSummary: document.getElementById('classSummary'),
      sgFilter: document.getElementById('sgFilter'),
      classDrawer: document.getElementById('classDrawer'),
      gradeRow: document.getElementById('gradeRow'),
      classGrid: document.getElementById('classGrid'),
      teacherPanel: document.getElementById('teacherPanel'),
      teacherInput: document.getElementById('teacherInput'),
      clearTeacherBtn: document.getElementById('clearTeacherBtn'),
      teacherChips: document.getElementById('teacherChips'),
      liveBar: document.getElementById('liveBar'),
      liveLeft: document.getElementById('liveLeft'),
      liveRight: document.getElementById('liveRight'),
      shareBtn: document.getElementById('shareBtn'),
      list: document.getElementById('contentList'),
      toast: document.getElementById('toast')
    };

    let RAW_JSON = null;
    let DAYS_MAP = {};
    let DAY_KEYS = [];
    let selectedDayKey = '';
    let DATA = null;
    let ALL_TEACHERS = [];
    let mode = 'class';
    let bellsTabDay = null;
    const hasSavedClassInitially = Boolean(localStorage.getItem('selected_class'));
    let drawerOpen = !hasSavedClassInitially;
    let currentGrade = localStorage.getItem('saved_grade') || '5';
    let currentClass = localStorage.getItem('selected_class') || '5 А';
    let currentSubgroup = localStorage.getItem('saved_subgroup') || 'all';
    let currentTeacher = localStorage.getItem('selected_teacher') || '';
    let deferredInstallPrompt = null;

    const ua = navigator.userAgent || '';
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIos = /iphone|ipad|ipod/i.test(ua);
    const isAndroid = /android/i.test(ua);
    const isInAppWebView = /Telegram|VKClient|Instagram|FBAN|FBAV|Line\/|wv\)/i.test(ua);
    const isDesktopFirefox = /firefox/i.test(ua) && !isAndroid && !isIos;

    if (!isStandalone && !isTgWebApp) {
      els.installBtn.style.display = 'inline-flex';
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        els.installBtn.style.display = 'inline-flex';
      });
      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        els.installBtn.style.display = 'none';
        els.installSheet.classList.remove('open');
        showToast('Приложение установлено');
      });
    }

    function buildInstallHelpHtml() {
      if (isInAppWebView) {
        return `
          <b>Открой сайт в основном браузере</b><br>
          Встроенное окно мессенджера блокирует установку. Нажми <b>⋮</b> в углу → <b>«Открыть в браузере»</b> (Chrome / Safari), затем нажми <b>📲</b>.<br>
          <button type="button" class="install-copy-btn" id="copySiteUrlBtn">Скопировать ссылку</button>
        `;
      }
      if (isIos) {
        return `
          <b>Установка на iPhone:</b> нажми <b>«Поделиться» (⬆️)</b> внизу Safari → <b>«На экран „Домой“» → «Добавить»</b>.
        `;
      }
      if (isAndroid) {
        return `
          <b>Установка на Android:</b> открой меню браузера <b>⋮</b> и выбери <b>«Установить приложение»</b> (или «Добавить на гл. экран»).
        `;
      }
      if (isDesktopFirefox) {
        return `
          <b>Установка на ПК:</b> настольный Firefox не поддерживает PWA — открой ссылку в <b>Chrome, Edge или Яндекс Браузере</b>.<br>
          <button type="button" class="install-copy-btn" id="copySiteUrlBtn">Скопировать ссылку</button>
        `;
      }
      return `Нажми на значок установки справа в адресной строке или в меню браузера <b>⋮ → «Установить ШРК Уроки»</b>.`;
    }

    els.installBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice && choice.outcome === 'accepted') {
          els.installBtn.style.display = 'none';
        }
        deferredInstallPrompt = null;
        return;
      }
      els.installSheetBody.innerHTML = buildInstallHelpHtml();
      els.installSheet.classList.toggle('open');
      const copyBtn = document.getElementById('copySiteUrlBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(location.origin + location.pathname);
            showToast('Ссылка скопирована');
          } catch (_) {}
        });
      }
    });

    els.installClose.addEventListener('click', () => els.installSheet.classList.remove('open'));

    els.creatorLink.addEventListener('click', (e) => {
      if (isTgWebApp && typeof window.Telegram.WebApp.openTelegramLink === 'function') {
        e.preventDefault();
        window.Telegram.WebApp.openTelegramLink('https://t.me/cryforsex');
      }
    });

    function syncTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      els.themeBtn.textContent = isLight ? '☀️' : '🌙';
      if (els.metaThemeColor) {
        els.metaThemeColor.setAttribute('content', isLight ? '#f4f6fa' : '#0b0f19');
      }
    }
    syncTheme();

    els.themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ui_theme', next);
      syncTheme();
    });

    function parseDateKey(str) {
      const m = String(str || '').match(/(\d{1,2})[._-](\d{1,2})[._-](\d{4})/);
      if (!m) return null;
      return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    }

    function formatDdMm(dateStr) {
      const m = String(dateStr || '').match(/(\d{1,2})[._-](\d{1,2})[._-](\d{4})/);
      return m ? `${m[1].padStart(2, '0')}.${m[2].padStart(2, '0')}` : dateStr;
    }

    function formatHumanTitle(dateStr, weekdayRaw) {
      const dt = parseDateKey(dateStr);
      if (!dt) return dateStr || 'Расписание';
      const dayNum = dt.getDate();
      const monthName = MONTHS_GEN[dt.getMonth()];
      let wd = weekdayRaw ? weekdayRaw.trim() : FULL_WD[dt.getDay()];
      wd = wd.charAt(0).toUpperCase() + wd.slice(1).toLowerCase();
      return `${wd}, ${dayNum} ${monthName}`;
    }

    function formatShortUpdated(updStr) {
      if (!updStr) return 'из MAX';
      const parts = updStr.trim().split(/\s+/);
      if (parts.length >= 2) {
        return `обновлено в ${parts[1]}`;
      }
      return `обновлено ${updStr}`;
    }

    function getMskNow() {
      const now = new Date();
      const parts = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(now);
      const map = {};
      parts.forEach(p => { map[p.type] = p.value; });
      const todayDt = new Date(Number(map.year), Number(map.month) - 1, Number(map.day));
      const tmrDt = new Date(todayDt);
      tmrDt.setDate(tmrDt.getDate() + 1);
      const pad = (n) => String(n).padStart(2, '0');
      return {
        dateStr: `${map.day}.${map.month}.${map.year}`,
        tomorrowStr: `${pad(tmrDt.getDate())}.${pad(tmrDt.getMonth() + 1)}.${tmrDt.getFullYear()}`,
        todayTs: todayDt.getTime(),
        minutes: Number(map.hour) * 60 + Number(map.minute)
      };
    }

    function pickInitialDayKey() {
      if (!DAY_KEYS.length) return '';
      const msk = getMskNow();
      const hasToday = DAY_KEYS.includes(msk.dateStr);
      if (hasToday && msk.minutes < 19 * 60 + 15) {
        return msk.dateStr;
      }
      const futureKeys = DAY_KEYS.filter(k => {
        const dt = parseDateKey(k);
        return dt && dt.getTime() > msk.todayTs;
      });
      if (futureKeys.length) return futureKeys[0];
      if (hasToday) return msk.dateStr;
      return DAY_KEYS[DAY_KEYS.length - 1];
    }

    function applySelectedDay(key) {
      if (!DAYS_MAP[key]) return;
      selectedDayKey = key;
      DATA = DAYS_MAP[key];
      ALL_TEACHERS = collectTeachers(DATA.classes);
      bellsTabDay = isScheduleMonday() ? 'monday' : 'regular';

      const dateVal = (DATA.meta && DATA.meta.date) || key;
      const wdVal = DATA.meta && DATA.meta.weekday;
      els.title.textContent = formatHumanTitle(dateVal, wdVal);

      const updTime = (RAW_JSON && RAW_JSON.updated_at) || DATA.updated_at || '';
      const offlineNote = navigator.onLine === false ? ' · офлайн' : '';
      els.meta.textContent = formatShortUpdated(updTime) + offlineNote;

      renderDaySwitcher();
      renderCurrentView();
    }

    // Показываем переключатель ТОЛЬКО если реально есть 2 или больше дней (без пустых кнопок-заглушек)
    function renderDaySwitcher() {
      if (DAY_KEYS.length < 2) {
        els.daySwitcher.style.display = 'none';
        return;
      }
      els.daySwitcher.style.display = 'flex';
      const msk = getMskNow();

      els.daySwitcher.innerHTML = DAY_KEYS.map(key => {
        const dt = parseDateKey(key);
        const wdShort = dt ? SHORT_WD[dt.getDay()] : '';
        let label = `${formatDdMm(key)} (${wdShort})`;
        let isFuture = false;

        if (key === msk.dateStr) {
          label = `Сегодня, ${formatDdMm(key)}`;
        } else if (key === msk.tomorrowStr) {
          label = `Завтра, ${formatDdMm(key)}`;
          isFuture = true;
        } else if (dt && dt.getTime() > msk.todayTs) {
          label = `${wdShort}, ${formatDdMm(key)}`;
          isFuture = true;
        }

        return `
          <button type="button" class="day-pill ${key === selectedDayKey ? 'active' : ''}" data-daykey="${escapeHtml(key)}">
            <span>${escapeHtml(label)}</span>
            ${isFuture ? '<span class="new-dot" title="Новое расписание"></span>' : ''}
          </button>
        `;
      }).join('');
    }

    els.daySwitcher.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-daykey]');
      if (!btn) return;
      applySelectedDay(btn.getAttribute('data-daykey'));
    });

    function setDrawerState(open) {
      drawerOpen = open;
      els.classDrawer.classList.toggle('open', drawerOpen);
      els.pickerTrigger.classList.toggle('open', drawerOpen);
    }
    setDrawerState(drawerOpen);

    els.pickerTrigger.addEventListener('click', () => {
      setDrawerState(!drawerOpen);
    });

    els.sgFilter.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-sg]');
      if (!btn) return;
      currentSubgroup = btn.getAttribute('data-sg');
      localStorage.setItem('saved_subgroup', currentSubgroup);
      renderClassUI();
    });

    function isScheduleMonday() {
      if (!DATA) return false;
      const wd = ((DATA.meta && DATA.meta.weekday) || '').toLowerCase();
      if (wd.includes('понедельник')) return true;
      if (wd && !wd.includes('понедельник')) return false;
      const dateRaw = (DATA.meta && DATA.meta.date) || DATA.source_file || '';
      const dt = parseDateKey(dateRaw);
      return dt ? dt.getDay() === 1 : false;
    }

    function getActiveBells() {
      return isScheduleMonday() ? BELLS_MONDAY : BELLS_REGULAR;
    }

    function toMin(hhmm) {
      if (!hhmm) return -1;
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    }

    function getBreakMinutes(bellsMap, numA, numB) {
      if (numB !== numA + 1 || !bellsMap[numA] || !bellsMap[numB]) return 0;
      return Math.max(0, toMin(bellsMap[numB].start) - toMin(bellsMap[numA].end));
    }

    function isScheduleToday() {
      if (!DATA || !DATA.meta || !DATA.meta.date) return false;
      return DATA.meta.date.trim() === getMskNow().dateStr;
    }

    function normStr(s) {
      return (s || '').toLowerCase().replace(/ё/g, 'е').trim();
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function roomBadge(room) {
      if (!room) return '';
      const r = room.trim();
      const up = r.toUpperCase();
      if (up === 'ДИСТ') {
        return `<span class="room dist">ДИСТ</span>`;
      }
      let cls = '';
      if (up.startsWith('Б.') || up.startsWith('B.')) cls = 'corp-b';
      else if (up.startsWith('В.')) cls = 'corp-v';
      return `<span class="room ${cls}">${escapeHtml(r)}</span>`;
    }

    function getGrade(clsName) {
      const m = String(clsName).match(/^(\d+)/);
      return m ? m[1] : '';
    }

    function collectTeachers(classesObj) {
      const set = new Set();
      Object.values(classesObj || {}).forEach(lessons => {
        (lessons || []).forEach(l => {
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              if (sg.teacher && sg.teacher.trim()) set.add(sg.teacher.trim());
            });
          } else if (l.teacher && l.teacher.trim()) {
            set.add(l.teacher.trim());
          }
        });
      });
      return Array.from(set).sort((a, b) => a.localeCompare(b, 'ru'));
    }

    function numColHtml(bellsMap, num) {
      const b = bellsMap[num];
      return `
        <div class="num-col">
          <div class="num-val">${escapeHtml(num)}</div>
          ${b ? `<div class="t-start">${b.start}</div><div class="t-end">${b.end}</div>` : ''}
        </div>
      `;
    }

    // Живая плашка показывается ТОЛЬКО когда реально идут уроки или за 45 мин до начала (ноль визуального шума ночью и вечером)
    function updateLiveBar(lessons) {
      if (!isScheduleToday() || !lessons || !lessons.length) {
        els.liveBar.style.display = 'none';
        return;
      }
      const bellsMap = getActiveBells();
      const nums = lessons.map(l => Number(l.lesson || l.num || 0)).filter(n => n > 0);
      if (!nums.length) {
        els.liveBar.style.display = 'none';
        return;
      }

      const cur = getMskNow().minutes;
      const firstNum = Math.min(...nums);
      const lastNum = Math.max(...nums);
      const firstStart = bellsMap[firstNum] ? toMin(bellsMap[firstNum].start) : -1;
      const lastEnd = bellsMap[lastNum] ? toMin(bellsMap[lastNum].end) : -1;

      if (firstStart > 0 && cur < firstStart) {
        const diff = firstStart - cur;
        if (diff <= 45) {
          els.liveBar.style.display = 'flex';
          els.liveLeft.innerHTML = `<span class="pulse"></span><span>${firstNum} урок начнётся через ${diff} мин</span>`;
          els.liveRight.textContent = bellsMap[firstNum].start;
          return;
        }
        els.liveBar.style.display = 'none';
        return;
      }

      if (lastEnd > 0 && cur >= lastEnd) {
        els.liveBar.style.display = 'none';
        return;
      }

      for (let i = 0; i < nums.length; i++) {
        const n = nums[i];
        const b = bellsMap[n];
        if (!b) continue;
        const s = toMin(b.start), e = toMin(b.end);
        if (cur >= s && cur < e) {
          els.liveBar.style.display = 'flex';
          els.liveLeft.innerHTML = `<span class="pulse"></span><span>Идёт ${n} урок · ещё ${e - cur} мин</span>`;
          els.liveRight.textContent = `до ${b.end}`;
          return;
        }
        if (i + 1 < nums.length) {
          const nextN = nums[i + 1];
          const nextB = bellsMap[nextN];
          if (nextB && cur >= e && cur < toMin(nextB.start)) {
            els.liveBar.style.display = 'flex';
            els.liveLeft.innerHTML = `<span class="pulse"></span><span>Перемена · ${nextN} урок через ${toMin(nextB.start) - cur} мин</span>`;
            els.liveRight.textContent = `в ${nextB.start}`;
            return;
          }
        }
      }

      els.liveBar.style.display = 'none';
    }

    function setMode(nextMode) {
      mode = nextMode;
      els.classControls.style.display = mode === 'class' ? 'block' : 'none';
      els.teacherPanel.style.display = mode === 'teacher' ? 'block' : 'none';
      els.tabClass.classList.toggle('active', mode === 'class');
      els.tabTeacher.classList.toggle('active', mode === 'teacher');
      els.tabBells.classList.toggle('active', mode === 'bells');
      renderCurrentView();
    }

    function renderCurrentView() {
      if (mode === 'class') renderClassUI();
      else if (mode === 'teacher') renderTeacherUI();
      else renderBellsUI();
    }

    function pluralLessons(n) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return `${n} урок`;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return `${n} урока`;
      return `${n} уроков`;
    }

    function renderClassUI() {
      if (!DATA || !DATA.classes) return;
      const allClasses = Object.keys(DATA.classes);
      if (!allClasses.length) {
        els.list.innerHTML = '<div class="empty-state">Расписание пока пустое</div>';
        return;
      }

      if (!DATA.classes[currentClass]) currentClass = allClasses[0];
      currentGrade = getGrade(currentClass) || currentGrade;
      localStorage.setItem('selected_class', currentClass);
      localStorage.setItem('saved_grade', currentGrade);

      els.currentClassLabel.textContent = currentClass;

      const grades = Array.from(new Set(allClasses.map(getGrade).filter(Boolean)))
        .sort((a, b) => Number(a) - Number(b));

      els.gradeRow.innerHTML = grades.map(g =>
        `<button type="button" class="grade-chip ${g === currentGrade ? 'active' : ''}" data-grade="${escapeHtml(g)}">${escapeHtml(g)}</button>`
      ).join('');

      const gradeClasses = allClasses.filter(c => getGrade(c) === currentGrade);
      els.classGrid.innerHTML = gradeClasses.map(c =>
        `<button type="button" class="class-chip ${c === currentClass ? 'active' : ''}" data-class="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join('');

      const lessons = DATA.classes[currentClass] || [];
      const bellsMap = getActiveBells();
      const nums = lessons.map(l => Number(l.lesson || l.num || 0)).filter(n => n > 0);

      if (nums.length) {
        const firstN = Math.min(...nums), lastN = Math.max(...nums);
        const spanTxt = (bellsMap[firstN] && bellsMap[lastN]) ? `${bellsMap[firstN].start}–${bellsMap[lastN].end}` : '';
        els.classSummary.textContent = `${pluralLessons(lessons.length)}${spanTxt ? ' · ' + spanTxt : ''}`;
      } else {
        els.classSummary.textContent = 'нет уроков';
      }

      const hasSubgroups = lessons.some(l => Array.isArray(l.subgroups) && l.subgroups.length > 0);
      els.sgFilter.style.display = hasSubgroups ? 'inline-flex' : 'none';
      els.sgFilter.querySelectorAll('[data-sg]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-sg') === currentSubgroup);
      });

      updateLiveBar(lessons);

      if (!lessons.length) {
        els.list.innerHTML = '<div class="empty-state">Уроков для выбранного класса нет</div>';
        return;
      }

      const todayMode = isScheduleToday();
      const curMin = getMskNow().minutes;
      const blocks = [];

      lessons.forEach((l, idx) => {
        const num = Number(l.lesson || l.num || (idx + 1));
        const b = bellsMap[num];
        const sMin = b ? toMin(b.start) : -1;
        const eMin = b ? toMin(b.end) : -1;
        const isNow = todayMode && sMin >= 0 && curMin >= sMin && curMin < eMin;
        const isPast = todayMode && eMin >= 0 && curMin >= eMin;
        const pct = isNow ? Math.min(100, Math.max(4, Math.round(((curMin - sMin) / (eMin - sMin)) * 100))) : 0;

        if (idx > 0) {
          const prevNum = Number(lessons[idx - 1].lesson || lessons[idx - 1].num || idx);
          if (num > prevNum + 1) {
            blocks.push(`<div class="divider-note">Окно · ${prevNum + 1} урок свободен</div>`);
          } else {
            const brk = getBreakMinutes(bellsMap, prevNum, num);
            if (brk >= 20) {
              blocks.push(`<div class="divider-note">Перемена ${brk} мин</div>`);
            }
          }
        }

        const stateCls = isNow ? 'is-now' : (isPast ? 'is-past' : '');
        const progHtml = isNow ? `<div class="lesson-progress" style="width:${pct}%"></div>` : '';

        if (Array.isArray(l.subgroups) && l.subgroups.length) {
          if (currentSubgroup !== 'all') {
            const chosenSg = l.subgroups.find(sg => String(sg.group) === currentSubgroup);
            if (chosenSg) {
              blocks.push(`
                <div class="lesson-card ${stateCls}">
                  ${numColHtml(bellsMap, num)}
                  <div class="body-col">
                    <div class="row-main">
                      <div class="subj">${escapeHtml(chosenSg.subject || 'Урок')}<span class="sg-inline-tag">${escapeHtml(chosenSg.group)} гр</span></div>
                      ${roomBadge(chosenSg.room)}
                    </div>
                    ${chosenSg.teacher ? `<button type="button" class="teacher-btn" data-jump-teacher="${escapeHtml(chosenSg.teacher)}">${escapeHtml(chosenSg.teacher)}</button>` : ''}
                  </div>
                  ${progHtml}
                </div>
              `);
            } else {
              blocks.push(`
                <div class="lesson-card is-past">
                  ${numColHtml(bellsMap, num)}
                  <div class="body-col">
                    <div class="subj" style="color:var(--muted);font-weight:600">Нет урока у ${escapeHtml(currentSubgroup)} подгруппы</div>
                  </div>
                </div>
              `);
            }
          } else {
            blocks.push(`
              <div class="lesson-card ${stateCls}">
                ${numColHtml(bellsMap, num)}
                <div class="body-col">
                  <div class="sg-split">
                    ${l.subgroups.map(sg => `
                      <div class="sg-row">
                        <div>
                          <div class="subj"><span class="sg-num-pill">${escapeHtml(sg.group)} гр</span>${escapeHtml(sg.subject || 'Урок')}</div>
                          ${sg.teacher ? `<button type="button" class="teacher-btn" data-jump-teacher="${escapeHtml(sg.teacher)}">${escapeHtml(sg.teacher)}</button>` : ''}
                        </div>
                        ${roomBadge(sg.room)}
                      </div>
                    `).join('')}
                  </div>
                </div>
                ${progHtml}
              </div>
            `);
          }
        } else {
          blocks.push(`
            <div class="lesson-card ${stateCls}">
              ${numColHtml(bellsMap, num)}
              <div class="body-col">
                <div class="row-main">
                  <div class="subj">${escapeHtml(l.subject || l.text || '')}</div>
                  ${roomBadge(l.room)}
                </div>
                ${l.teacher ? `<button type="button" class="teacher-btn" data-jump-teacher="${escapeHtml(l.teacher)}">${escapeHtml(l.teacher)}</button>` : ''}
              </div>
              ${progHtml}
            </div>
          `);
        }
      });

      els.list.innerHTML = `<div class="lessons-stack">${blocks.join('')}</div>`;
    }

    function renderTeacherUI() {
      if (!DATA || !DATA.classes) return;
      const rawQuery = els.teacherInput.value;
      els.clearTeacherBtn.style.display = rawQuery ? 'block' : 'none';
      const query = normStr(rawQuery);
      const filteredTeachers = ALL_TEACHERS.filter(t => !query || normStr(t).includes(query));

      if ((!currentTeacher || !filteredTeachers.includes(currentTeacher)) && filteredTeachers.length) {
        currentTeacher = filteredTeachers[0];
      }

      els.teacherChips.innerHTML = filteredTeachers.map(t =>
        `<button type="button" class="teacher-chip ${t === currentTeacher ? 'active' : ''}" data-teacher="${escapeHtml(t)}">${escapeHtml(t)}</button>`
      ).join('');

      const targetExact = filteredTeachers.includes(currentTeacher) ? currentTeacher : '';
      const hits = [];

      Object.entries(DATA.classes).forEach(([cls, lessons]) => {
        (lessons || []).forEach(l => {
          const num = Number(l.lesson || l.num || 0);
          if (Array.isArray(l.subgroups)) {
            l.subgroups.forEach(sg => {
              const tName = (sg.teacher || '').trim();
              const matched = targetExact ? (tName === targetExact) : (query && normStr(tName).includes(query));
              if (matched) {
                hits.push({ lesson: num, num, cls: `${cls} (${sg.group} гр)`, subject: sg.subject, room: sg.room, teacher: tName });
              }
            });
          } else {
            const tName = (l.teacher || '').trim();
            const matched = targetExact
              ? (tName === targetExact)
              : (query && (normStr(tName).includes(query) || normStr(l.text).includes(query)));
            if (matched) {
              hits.push({ lesson: num, num, cls, subject: l.subject || l.text, room: l.room, teacher: tName });
            }
          }
        });
      });

      hits.sort((a, b) => a.num - b.num || a.cls.localeCompare(b.cls, 'ru'));
      updateLiveBar(hits);

      if (!hits.length) {
        els.list.innerHTML = '<div class="empty-state">Уроков для выбранного учителя не найдено</div>';
        return;
      }

      const bellsMap = getActiveBells();
      const todayMode = isScheduleToday();
      const curMin = getMskNow().minutes;
      const blocks = [];

      hits.forEach((h, idx) => {
        const b = bellsMap[h.num];
        const sMin = b ? toMin(b.start) : -1;
        const eMin = b ? toMin(b.end) : -1;
        const isNow = todayMode && sMin >= 0 && curMin >= sMin && curMin < eMin;
        const isPast = todayMode && eMin >= 0 && curMin >= eMin;

        if (idx > 0) {
          const prevNum = hits[idx - 1].num;
          if (h.num > prevNum + 1) {
            blocks.push(`<div class="divider-note">Окно · ${h.num - prevNum - 1} ур.</div>`);
          } else {
            const brk = getBreakMinutes(bellsMap, prevNum, h.num);
            if (brk >= 20) {
              blocks.push(`<div class="divider-note">Перемена ${brk} мин</div>`);
            }
          }
        }

        blocks.push(`
          <div class="lesson-card ${isNow ? 'is-now' : (isPast ? 'is-past' : '')}">
            ${numColHtml(bellsMap, h.num)}
            <div class="body-col">
              <div class="row-main">
                <div class="subj">${escapeHtml(h.cls)} · ${escapeHtml(h.subject || '')}</div>
                ${roomBadge(h.room)}
              </div>
              <div class="teacher-btn" style="cursor:default;text-decoration:none">${escapeHtml(h.teacher || '')}</div>
            </div>
          </div>
        `);
      });

      els.list.innerHTML = `<div class="lessons-stack">${blocks.join('')}</div>`;
    }

    function renderBellsUI() {
      els.liveBar.style.display = 'none';
      if (!bellsTabDay) {
        bellsTabDay = isScheduleMonday() ? 'monday' : 'regular';
      }
      const chosenMap = bellsTabDay === 'monday' ? BELLS_MONDAY : BELLS_REGULAR;
      const curMin = getMskNow().minutes;
      const highlightToday = isScheduleToday() && ((bellsTabDay === 'monday') === isScheduleMonday());

      const switchHtml = `
        <div class="bells-switch">
          <button type="button" class="bells-switch-btn ${bellsTabDay === 'monday' ? 'active' : ''}" data-bday="monday">Понедельник (1 ур. — 30 мин)</button>
          <button type="button" class="bells-switch-btn ${bellsTabDay === 'regular' ? 'active' : ''}" data-bday="regular">Вт – Пт (все по 40 мин)</button>
        </div>
      `;

      const rows = Object.entries(chosenMap).map(([numStr, b]) => {
        const n = Number(numStr);
        const isNow = highlightToday && curMin >= toMin(b.start) && curMin < toMin(b.end);
        const brk = getBreakMinutes(chosenMap, n, n + 1);
        const isBig = brk >= 20;
        const brkLabel = brk > 0 ? `${brk} мин` : '—';
        return `
          <div class="bells-row ${isNow ? 'is-now' : ''}">
            <div class="bells-num">${n} урок</div>
            <div class="bells-time">${b.start} – ${b.end}</div>
            <div class="bells-brk ${isBig ? 'big' : ''}">${brk > 0 ? 'пер. ' + brkLabel : brkLabel}</div>
          </div>
        `;
      }).join('');

      els.list.innerHTML = `${switchHtml}<div class="bells-card">${rows}</div>`;
    }

    function buildShareText() {
      if (!DATA || !DATA.classes) return '';
      const bellsMap = getActiveBells();
      const dateStr = (DATA.meta && DATA.meta.date) ? DATA.meta.date : '';
      const wd = (DATA.meta && DATA.meta.weekday) ? ` (${DATA.meta.weekday})` : '';
      const lessons = DATA.classes[currentClass] || [];
      const sgSuffix = currentSubgroup !== 'all' ? ` (${currentSubgroup} гр)` : '';
      const lines = [`Расписание ${currentClass}${sgSuffix} на ${dateStr}${wd}:`];

      lessons.forEach(l => {
        const n = l.lesson || l.num;
        const t = bellsMap[n] ? ` ${bellsMap[n].start}–${bellsMap[n].end}` : '';
        if (Array.isArray(l.subgroups)) {
          if (currentSubgroup !== 'all') {
            const sg = l.subgroups.find(x => String(x.group) === currentSubgroup);
            if (sg) lines.push(`${n}.${t} ${sg.subject} [${sg.room || '—'}]`);
          } else {
            lines.push(`${n}.${t}:`);
            l.subgroups.forEach(sg => {
              lines.push(`  • ${sg.group} гр: ${sg.subject} [${sg.room || '—'}]`);
            });
          }
        } else {
          lines.push(`${n}.${t} ${l.subject || l.text} [${l.room || '—'}]`);
        }
      });
      lines.push(`\n${location.origin}${location.pathname}`);
      return lines.join('\n');
    }

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add('show');
      setTimeout(() => els.toast.classList.remove('show'), 2000);
    }

    els.shareBtn.addEventListener('click', async () => {
      const text = buildShareText();
      if (navigator.share) {
        try {
          await navigator.share({ title: els.title.textContent, text });
          return;
        } catch (_) {}
      }
      try {
        await navigator.clipboard.writeText(text);
        showToast('Расписание скопировано');
      } catch (_) {
        showToast('Не удалось скопировать');
      }
    });

    els.tabClass.addEventListener('click', () => setMode('class'));
    els.tabTeacher.addEventListener('click', () => setMode('teacher'));
    els.tabBells.addEventListener('click', () => setMode('bells'));

    // Клик по учителю прямо из карточки урока + переключение дня в Звонках
    els.list.addEventListener('click', (e) => {
      const jumpBtn = e.target.closest('[data-jump-teacher]');
      if (jumpBtn) {
        currentTeacher = jumpBtn.getAttribute('data-jump-teacher');
        localStorage.setItem('selected_teacher', currentTeacher);
        els.teacherInput.value = '';
        setMode('teacher');
        return;
      }
      const bBtn = e.target.closest('[data-bday]');
      if (bBtn) {
        bellsTabDay = bBtn.getAttribute('data-bday');
        renderBellsUI();
      }
    });

    els.gradeRow.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-grade]');
      if (!btn || !DATA) return;
      currentGrade = btn.getAttribute('data-grade');
      renderClassUI();
    });

    els.classGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-class]');
      if (!btn) return;
      currentClass = btn.getAttribute('data-class');
      setDrawerState(false);
      renderClassUI();
    });

    els.teacherChips.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-teacher]');
      if (!btn) return;
      currentTeacher = btn.getAttribute('data-teacher');
      localStorage.setItem('selected_teacher', currentTeacher);
      renderTeacherUI();
    });

    els.teacherInput.addEventListener('input', () => {
      currentTeacher = '';
      renderTeacherUI();
    });

    els.clearTeacherBtn.addEventListener('click', () => {
      els.teacherInput.value = '';
      currentTeacher = '';
      renderTeacherUI();
      els.teacherInput.focus();
    });

    setInterval(() => {
      if (DATA) {
        renderDaySwitcher();
        renderCurrentView();
      }
    }, 30000);

    fetch('./schedule.json?t=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(json => {
        RAW_JSON = json;
        DAYS_MAP = {};
        if (json.days && typeof json.days === 'object' && Object.keys(json.days).length) {
          Object.entries(json.days).forEach(([k, v]) => {
            if (v && v.classes) DAYS_MAP[k] = v;
          });
        } else if (json.classes) {
          const singleKey = (json.meta && json.meta.date) || 'current';
          DAYS_MAP[singleKey] = json;
        }

        DAY_KEYS = Object.keys(DAYS_MAP).sort((a, b) => {
          const da = parseDateKey(a), db = parseDateKey(b);
          return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
        });

        const initialKey = pickInitialDayKey();
        if (initialKey) {
          applySelectedDay(initialKey);
        }
      })
      .catch(err => {
        els.meta.textContent = 'Ошибка загрузки: ' + err.message;
      });
  </script>
</body>
</html>
